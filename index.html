<script>
const DATA = [{"title": "序言：人文源流的追尋", "articles": [{"day": 0, "title": "一、追尋意義的動物", "body": "<p>人是動物，但人是會追尋意義的動物。隨著智能提升，人類開始擁有個體意識，發明農業，學習群居，建立村莊、城市，發明文字、禮儀、宗教……</p><p>但文明並不代表幸福。</p><p>疾病、階層之間的壓迫、單一的生活、和大自然的剝離、戰爭、掠奪和死亡，都會令人反思，究竟生命有何意義，人類存在有何意義，我們可以怎樣擁有更好的生活。</p><p>終於人類到了軸心時代。</p><p>在短短幾百年間，世界各地出現了好些人物，他們各自提出自己的思考，和對人生的答案。他們的思想改變了歷史，也改寫了人類的命運。</p>"}, {"day": 0, "title": "二、蘇格拉底", "body": "<p>首先是出生於古希臘的蘇格拉底。古希臘承繼周圍的古埃及和地中海文明，建立偉大的城邦。</p><p>在雅典城，人們擁有民主制度（雖然只限男性公民），宏偉的衛城，蓬勃的商業。而且在蘇格拉底之前，古希臘已經有不少哲學家，思考宇宙和知識的本質。</p><p>但正是蘇格拉底，將思考的焦點從天上帶回人間，思考怎樣才是更好的社會，思考何謂公義，何謂勇氣，思考道德的價值。他痛心雅典人只顧追逐名利，卻忘記反思生活的意義。</p><p>蘇格拉底最終以生命為代價，被雅典人處死。但即使如此，他也不忘於死前的審訊中，提醒雅典人要省察自己的生命，因為未經檢驗的人生沒有價值……</p><p>蘇格拉底雖死，但他的思考和精神，卻透過學生傳續。柏拉圖、亞里士多德相繼開辦學校，寫下著作，繼續思考人生意義，思考社會的本質。</p><p>他們之後的斯多葛、伊壁鳩魯諸學派，也提出了自己的一家之言。但更重要的，是蘇格拉底求真、愛智的精神，已成為古希臘，以至西方哲學的傳統，延續至今。</p>"}, {"day": 0, "title": "三、佛陀", "body": "<p>在印度，有佛陀釋迦牟尼。佛陀出身貴族家庭，本來衣食無憂，但卻在見證生老病死等人間常態後出家，思考世界本質，人生意義。最終他在菩提樹下悟道，提出四聖諦、八正道等概念。</p><p>根據佛陀的觀察，這世界本是無常，不斷變化生滅。但當人執著於某事某物的存在，便產生求不得愛別離等諸苦，遂墮輪迴不得解脫。</p><p>所以佛陀提出的解脫方法，就是透過簡樸的生活，正確的認知和行為，讓人因了悟世界實相而擺脫執著，得到解脫。</p><p>值得一提的是，佛陀雖已證道，但並未因此離開人間。在他六十年的餘生中，他一直努力將覺悟傳授給弟子和眾生。他也保持著一顆慈悲心，不忍見眾生受苦，願意貢獻自己，以求眾生能夠離苦得樂。</p><p>後人透過佛陀的教導，又提出空性等概念。他們指出，既然萬物都在變化生滅，那麼萬物其實互相關連，無一物能夠獨自存在。</p><p>而既然萬物俱為一體，彼受苦即己受苦，無人能夠獨善其身。因此又產生菩薩道等概念，希望因著智慧，透過布施、忍辱、精進等方法，救眾生於苦海之中。</p><p>佛陀雖死，他之後的大乘佛教可能與他本來所指引的大異其趣，但他的言行，他對世界本質的認知，他的慈悲心，卻繼續影響亞洲，以至世界各地。</p>"}, {"day": 0, "title": "四、孔子", "body": "<p>在中國有孔子。孔子出生於一個沒落貴族家庭，當時社會秩序崩壞，百家爭鳴，大家紛紛提出改變社會的方法。而孔子提出的方法，是重拾禮制，讓個人克制自己，回歸本來規範，社會自然回復秩序。</p><p>在孔子有生之年，或者之後二千年，他的理想並沒有實現，也未必有需要實現。但孔子最大的貢獻，是指出禮制的背後，是一顆仁心。在孔子眼裡，每個人都是道德主體，都有行善/行仁的能力。每個人都可以透過立志和努力，成就自己的理想人格，成為君子。</p><p>而孔子亦以一生實踐自己的理念。無論是為官，為師，無論身處順境，逆境，孔子都努力以人為本，因材施教，完善自己，成就他人。</p><p>孔子死後，他的學說成為中國社會的主流思想，仁義道德亦成為中國人至少表面上注重的價值。</p>"}, {"day": 0, "title": "五、耶穌", "body": "<p>在三位聖哲之後數百年，在中東的猶太地，有耶穌。耶穌承繼猶大先知的傳統，三十歲時橫空出現，語帶權威，呼籲眾人悔改之餘，亦宣稱自己是神的兒子，召集門徒來跟從。</p><p>雖然年紀不大，但耶穌的話語亦甚具智慧，例如對天國的比喻，或道德金律：你們願意人怎樣待你，你也要怎樣待人。雖然我們不清楚耶穌是否真的是神的兒子，但我們知道他的確對人類充滿大愛，願意背負人類罪孽，以至於死，且死在十字架上。</p><p>耶穌死後，他的道由門徒傳承。和耶穌一樣，眾門徒懷著捨己精神，將神的愛繼續傳揚，其中以彼得、保羅等最為著名。</p><p>基督教日後成為西方國教，壟斷歐洲社會至少一千年。耶穌博愛、平等的思想，亦成為現代西方社會的主流價值。</p><p>以上四聖哲雖然背景，影響各有不同，但他們都有一個共同之處，就是十分注重人。他們對人有深厚的情感，關心他們的福祉，不忍他們受苦，希望他們有更好的人生。他們代表，宣揚的價值，成為人文精神的源頭，在世界各地流淌，直至如今。</p>"}, {"day": 0, "title": "六、帝國與信仰", "body": "<p>特別的是，雖然眾聖哲希望人們能夠覺醒，但他們的思想往往被當權者利用，成為鞏固統治的宗教或意識形態。在往後的一千五百年，部落被整合成帝國，思想轉化成宗教，人類進入帝國和信仰的時代。</p><p>在中東和歐洲，耶穌和門徒的教導被整理成聖經，教義由教會控制，教會兼而掌握世俗權力。耶穌過後六百年，出身阿拉伯的穆罕默德結合猶太教和基督教特點，創立更容易在生活實踐的伊斯蘭教。之後一千年，基督教和伊斯蘭教一起成為歐亞大陸的主流宗教，影響力由伊比利亞半島一路延伸到東南亞。</p><p>在印度，佛陀的教誨雖然風行一時，但不久後轉化成以崇拜佛陀為中心的大乘佛教，甚至有了更多的傳說和神佛。再之後，印度的婆羅門吸收佛教教義，佛教在印度本土消失，反而在亞洲東部流傳，補充儒家學說對形而上描述有所欠缺的不足。</p><p>在東亞，孔子的儒家學說一直是中國的主流思想，但統治者更為重視其中有關禮教的部分，藉以鞏固統治。儒家學說逐漸變得僵化刻板，日後更有「禮教吃人」之說。不過孔子的一顆仁心，仍然流傳在歷代儒者的心中。</p><p>而蘇格拉底，以至古希臘羅馬哲學和科學的經歷更為神奇。他們在歐洲逐漸失傳，但卻被拜占庭/伊斯蘭文明保存，在巴格達的智慧宮中傳頌；直到一千年後，他們才重新被翻譯，在歐洲文明重新出現。</p><p>以下說法大概甚有爭議，但當一個缺乏理性基礎的宗教或信念成為社會的主流意識形態，信徒雖然可以安頓生死，找到生命意義，但社會卻容易變得封閉、僵化、停滯，甚至充滿偏見、歧視、自義，和意識形態之間的鬥爭。</p><p>另外從客觀條件來說，身處信仰時代的人們過得並不幸福。雖然偶有盛世，但在歷史中更為常見的，是饑荒、瘟疫、戰爭和毀滅。人類就好像在成住壞空的循環中浮浮沉沉，看不到盡頭。</p><p>一直要到一千五百年後，人類才有了新的突破。突破從歐洲開始，以文藝復興、啟蒙時代為開端，人類進入現代。</p>"}, {"day": 0, "title": "七、突破", "body": "<p>西方，以至人類的現代，由六百多年前的文藝復興開始。當時歐洲經過黑死病的蹂躪，加上十字軍東征、拜占庭陷落等等事件，大量古典著作被譯為本地文字，再經新興的印刷術傳播，社會因而脫離封建制度和教會的轄制，將焦點重新放在「人」身上。一時間，文學、藝術大放異彩，誕生了但丁、達文西、米高安哲羅等等大師。</p><p>在文學藝術以外，社會將焦點重新放在人和周遭環境，也促成現代科學崛起。1543年，哥白尼發表日心說，重新定義地球位置；數十年後，伽利略在比薩斜塔上進行自由落體實驗，推翻古代物理學；1687年，牛頓提出萬有引力理論，進一步解釋了自然世界所發生的現象。</p><p>除了自然科學，人類在社會科學上也有突破。人類放下君權神授、教會獨大的傳統，延續古希臘哲學家的思考，開始思考人的權利，社會形態等議題。盧梭、洛克、亞當斯密等學說，令人類進入啟蒙時代。</p><p>政治學說的發展亦催生了新政體的出現。英國在1689年通過權利法案，規定君主立憲原則，1776年美國獨立，在獨立宣言中明確提出人有天賦人權，生命、自由、追尋幸福等乃是人生而不可剝奪的權利，之後更訂立世界上第一套成文憲法，沿用至今。</p><p>除了思想和制度，科學的進步亦催生了科技的發展。1769年，瓦特改良蒸汽機，將動力來源由動物提升為化學燃料；1876年，貝爾發明電話，加速資訊流通；1913年，福特改良現代流水式工廠，將生產進一步標準化。經過工業革命，人類的生產力、物質條件和平均壽命大幅增加，甚至突破了馬爾薩斯所預言的人口增長困局。</p>"}, {"day": 0, "title": "八、上帝已死", "body": "<p>但隨著科技進步，物質條件提升，人類或許減少了痛苦，卻未必變得更為幸福。由於科學為自然世界提供了一個更可靠的解釋，科技也比宗教更有效的改善現實生活，宗教逐漸退潮，甚至被視為迷信和落後。宗教不再是人生活不可或缺的一部分，甚至有「上帝已死」的說法。</p><p>但宗教退潮，卻同時令人失去信仰。科學或者可以解釋世界，卻不能提供意義，或者帶來希望。作為尋找意義的動物，人駭然發現眼前的世界空虛混沌，無人能夠指引方向。</p><p>而科技的急速發展只帶來更大落差——到了二十世紀，人有能力飛上太空，甚至第一次擁有毀滅自己的能力，卻無法解釋自己為何存在，生活有何意義。</p><p>為了填補宗教退潮帶來的空洞，人類也曾嘗試實現不同思潮——民族主義、浪漫主義、共產主義、法西斯主義，以至現在西方社會最常見的資本消費主義。社會鼓勵人們多賺錢，多消費，仿佛擁有更多金錢，更多奢侈品便代表幸福。</p><p>但從多種觀察可見，擁有更多金錢或可減少痛苦，卻未必能帶來更大幸福，因為金錢和消費本身並不能帶來意義和滿足。可是，沒有信念的人生同樣令人覺得空虛。那麼，我們有沒有一套信念，能夠在保留理性的基礎上，同時為生活帶來意義？</p>"}, {"day": 0, "title": "九、人文精神", "body": "<p>行文至此，想必大家已經猜到答案。這答案在二千年前已經出現。</p><p>無論是孔子的仁心，耶穌的大愛，佛陀的慈悲，還是蘇格拉底的詰問，他們都在展現同一種精神——一種相信人、重視人、相信人有行善的能力，相信我們可以活得更好的人文精神。這種精神在歷史上若隱若現，卻從未消失。</p><p>當然，人文精神並不單單包含四大聖哲，也包含曼德拉，包含居里夫人，以至人類有歷史以來的種種善行善念。</p><p>甚至擴大來說，人文精神也包括人類文化所展現的不同方式，無論是音樂、話劇、詩詞舞蹈，還是飲食、工藝或建築，它們都展現了人類文明的變化和豐富，讓我們心生珍惜，希望將他們保存，以至發揚光大。</p><p>而且到了當下，我們對人文精神的需要或許更為巨大。一方面人與非人之間的邊際逐漸消融，人工智能、機器人的出現，都在挑戰人的存在意義和獨特性。</p><p>另一方面，人類與外太空之間已是一水之隔。隨著我們在一百年內或可定居月球，登陸火星，人類走出地球已是指日可待之事。不過，我們可以接受人類同樣將貪婪、兇殘，或者將地表毀滅的力量帶到全宇宙嗎？這是我們需要思考，需要解決的問題。</p>"}, {"day": 0, "title": "十、人文精神的實踐", "body": "<p>扯得太遠了。那麼回到生活，我們可以怎樣實踐人文精神？雖然每一個人的處境不同，但我覺得有三件事值得一做。</p><p>首先，是將別人看作人般看待。在繁忙的鬧市裡，生活往往將每一個人壓縮為工具、個案、資源、問題。但可能只需要一個招呼，一句多謝，或者代入對方的立場想想，我們便能將對方還原為一個有尊嚴，有情感的人，也將自己從處理問題的機器還原為一個活生生的人。這些微小善行說難不難，說易不易，卻可能讓我們的生活大為改觀。</p><p>另外，雖然每個人一出生便有一顆仁心，但仍然需要後天栽培和努力，讓自己的智慧和善念繼續增長。如果基督徒會每日靈修，擁有人文精神的人也要每天修行，透過閱讀經典、日常練習等方式，讓自己擁有更多方法，更堅定的決心實踐自己的信念。</p><p>最後，就如佛教徒有僧團，基督徒有教會，擁有人文精神的人也可以組成團體，互相支持，互相學習，讓實踐人文精神變得更為容易。在外國，有 American Humanist Association 或 School of Life。在香港，我們有什麼？大家不妨找找，甚至自組一個。</p>"}, {"day": 0, "title": "十一、結語", "body": "<p>最後，容許我以自己的個人經歷作結。</p><p>我自小便喜愛思考人生意義，曾經上過教會，也讀過不同宗教的經典，甚至裸辭環遊世界。但到了最後，我仍然覺得空虛，不知人生意義為何。直到有一天，我想起蘇格拉底，想起孔子，想起富蘭克林和所有我仰慕的人，想起他們的善行，想起他們的一顆心。</p><p>在那一刻，我仿佛成為一滴水，融入人文精神這條大河。我雖然不能超脫生死，但卻不再感到孤單，因為我知道我只是漫長河流的其中一滴。在我以前，有千千萬萬人思考過，掙扎過；在我之後，也會有無數人繼續這段尋索。</p><p>人文精神讓我找到意義，也找到生命的方向。希望大家有一天也能找到生命的意義，共勉之。</p>"}]}, {"title": "第一章：引言——人為何追尋意義", "articles": [{"day": 1, "title": "我們為何要談人文？", "body": "<p>有一個問題，我問過很多人，答案往往出奇地一致。</p><p>「你覺得自己幸福嗎？」</p><p>他們會停頓，想一想，然後說：「還好吧。」</p><p>「還好」是什麼意思？是沒有大病，工作穩定，家人平安，沒什麼好抱怨。但「還好」不是幸福。「還好」是一種懸浮的狀態，是打了折的人生。</p><p>我們生活在一個前所未有豐裕的時代。香港人的平均預期壽命是全球最高之一，超過八十五歲。我們有智能手機、有外賣、有Netflix、有週末。我們的物質條件遠超過曾祖父母那一代人所能想像。</p><p>然而，根據2023年世界幸福報告，香港在全球幸福指數排名第82位，遠落後於北歐各國，甚至在亞洲也被台灣、新加坡、日本拋離。這不是一個孤立的數據。抑鬱症、焦慮症、職業倦怠的比率在全球都在上升，心理健康危機已是公共衛生問題。</p><blockquote>我們把物質的問題基本解決了，卻發現內心有一個洞，什麼都填不滿。</blockquote><p>這個洞，不是消費能填滿的。不是換一份工、換一個城市、換一個伴侶能填滿的。它更根本，更安靜，更持久。它是意義的缺席。</p><p>而人文精神，就是人類幾千年來嘗試填補這個洞的努力。</p><p>接下來一百天，我們一起回頭看，那些曾經思考過這些問題的人，他們說了什麼，做了什麼，留下了什麼。不是為了考試，不是為了炫學，而是因為那些問題，就是我們今天的問題。</p>"}, {"day": 2, "title": "動物也追尋意義嗎？", "body": "<p>黑猩猩會哀悼死去的同伴。大象會在族群成員的骸骨旁停留，用鼻子輕輕觸碰，久久不去。烏鴉懂得使用工具。章魚能夠解決複雜的謎題。</p><p>動物比我們以為的更聰明，更有情感。但有一件事，目前為止只有人類在做：追尋意義。</p><p>意義是什麼？意義是超越眼前的連結。一棵樹不問自己為何生長；一匹狼獵食是因為飢餓，而不是因為覺得這是自己的使命。但人會問：我為什麼在這裡？我的死亡意味著什麼？我的生命有沒有留下什麼？</p><blockquote>歷史學家哈拉瑞指出，人類大約在七萬年前發生了一場「認知革命」，我們開始能夠討論不存在的事物——神靈、國家、人權、公司——這些都是人類共同想象出來的現實。正因為我們能夠共享故事，我們才能大規模合作，才能建立文明。</blockquote><p>但這種能力是雙刃劍。能夠想象未來，就能夠恐懼未來。能夠意識到死亡，就必須面對死亡。能夠問「為什麼」，就必須承受沒有答案的時刻。</p><p>存在主義哲學家卡繆說，真正嚴肅的哲學問題只有一個：人生值不值得活下去。這句話聽起來沉重，卻是最誠實的起點。因為如果我們不問這個問題，我們只是在漂，而不是在活。</p><p>追尋意義，是人的負擔，也是人的尊嚴。動物不問，所以它們不苦惱；但它們也沒有貝多芬，沒有杜甫，沒有甘地。那些偉大的創造，都是從追問開始的。</p>"}, {"day": 3, "title": "文明讓人幸福了嗎？", "body": "<p>讓我說一個你可能不太願意聽的事實。</p><p>農業的發明，很可能讓人類過得更差。</p><p>這聽起來像悖論。農業不是人類最偉大的發明之一嗎？不是農業才催生了城市、文字、帝國和文明嗎？是的。但從個體的角度看，從骨骼化石的角度看——農業之後的早期人類，比農業之前的狩獵採集者更矮、更多疾病、更短命、更勞累。</p><p>考古學家分析了從狩獵採集到農耕時代的人類骸骨，發現農業時代初期的人類牙齒損耗更嚴重，脊椎病變更多，平均身高下降了幾厘米。</p><blockquote>我們以文明為代價換來的，不是幸福，而是複雜。</blockquote><p>農業帶來了剩餘糧食，剩餘糧食帶來了儲存，儲存帶來了財富，財富帶來了階層，階層帶來了統治者和被統治者。文字的發明最初主要是用來記帳和徵稅，而不是詩歌。</p><p>當然，這不是說文明是錯誤的，也不是說我們應該回到叢林。現代醫學、疫苗、抗生素讓人類壽命翻倍；網際網路讓一個小鎮少年也能接觸莎士比亞和量子力學。文明有它的壯麗。</p><p>但承認文明的代價，是誠實的開始。人類每一次大躍進——農業革命、工業革命、數碼革命——都同時帶來了新的問題，新的不平等，新的失落。</p><p>正因如此，歷史上每一個偉大的思想家，都是在文明的某個節點上，看見了裂縫，然後開口說話。那麼，我們這個時代出了什麼問題？</p>"}, {"day": 4, "title": "軸心時代：改變歷史的幾百年", "body": "<p>有一件事，在歷史上發生過一次，讓哲學家至今仍覺得神奇。</p><p>大約在公元前800年到公元前200年之間，在彼此幾乎沒有聯繫的不同文明裡，同時出現了一批思想家，他們各自提出了對人類至今仍有影響的思想。</p><p>在中國，孔子、老子、孟子相繼出現。在印度，佛陀釋迦牟尼在菩提樹下悟道。在希臘，蘇格拉底、柏拉圖、亞里士多德在雅典的廣場辯論。在波斯，瑣羅亞斯德建立了善惡二元的宗教體系。在以色列，先知們寫下後來成為舊約的篇章。</p><blockquote>德國哲學家雅斯培在1949年將這段時期命名為「軸心時代」——人類精神的軸心，就在那幾百年間轉動了。</blockquote><p>為什麼偏偏是那個時代？學者們提出不同解釋：鐵器的普及帶來了更劇烈的社會動盪，戰爭頻繁，舊秩序崩潰；貿易的興起讓不同文化接觸，打破了封閉的世界觀；文字的成熟讓思想可以被記錄和傳播。那是一個舊答案失效、新問題湧現的時代。</p><p>那些思想家們，沒有電話，沒有互聯網，卻幾乎同步觸碰到了同樣的問題：人應該怎樣活？什麼是好的社會？苦難從何而來，又如何超越？</p><p>二千五百年後，他們的答案依然在流通。這不是巧合，這說明那些問題從未真正被解決，只是被一代又一代人重新打開。而我們，就是下一代打開它的人。</p>"}, {"day": 5, "title": "四位聖哲的共同點", "body": "<p>如果你把孔子、佛陀、蘇格拉底和耶穌放在同一張桌子上，他們大概會吵起來。他們說的語言不同，身處的文化不同，對宇宙的理解不同，對神的看法不同。孔子說克己復禮，佛陀說諸行無常，蘇格拉底說未經檢驗的人生沒有價值，耶穌說愛你的仇敵。這四句話，從任何角度看都不是同一句話。</p><p>但有一件事，他們是一樣的。他們都不在乎自己的安危。</p><p>蘇格拉底有機會逃跑，他拒絕了，飲下毒酒。耶穌知道自己去耶路撒冷意味著什麼，仍然去了。佛陀在悟道之後本可以獨自解脫，卻選擇留在人間傳法直到八十歲。孔子在魯國不受重用，周遊列國十四年，顛沛流離，從未放棄。</p><blockquote>他們相信人可以更好，相信這件事重要到值得用一生去做，甚至值得用生命去換。</blockquote><p>他們之所以做這些，是因為他們對人有一種深沉的情感——不是憐憫，不是施捨，而是真正的在乎。他們看著周圍的人受苦、迷失、互相傷害，覺得不能不說，不能不做。</p><p>這是人文精神最原始的形態：因為在乎人，所以不沉默。</p>"}, {"day": 6, "title": "意義從哪裡來？", "body": "<p>心理學家維克多·弗蘭克在納粹集中營裡待了三年，目睹了人類最黑暗的景象。父親死於集中營，母親和妻子先後在毒氣室遇難。他自己也不知道明天會不會輪到自己。</p><p>但他在集中營裡觀察到了一件事：在同樣惡劣的條件下，有些人垮了，有些人撐下來了。垮掉的人和撐下來的人，最大的差別不是體力，不是運氣，而是——有沒有一個「為什麼」。</p><p>弗蘭克後來把這個觀察寫成了《活出意義來》，成為二十世紀最重要的心理學著作之一。他說：「一個人知道自己為何而活，就可以忍受幾乎任何的如何而活。」</p><blockquote>意義不是被給予的，是被找到的——或者，是被選擇的。</blockquote><p>這個觀察有現代神經科學的支持。研究顯示，擁有清晰人生目的感的人，壓力荷爾蒙皮質醇的水平較低，免疫系統更強，睡眠質素更好，甚至認知衰退的速度更慢。意義感不只是哲學概念，它是身體需要的養分。</p><p>那麼，意義從哪裡來？人類學家和心理學家的研究指向幾個共同的來源：與他人的深層連結、對某個比自己更大的事物的貢獻、創造和表達、以及對個人成長的持續追求。注意：這四個來源裡，沒有金錢，沒有地位，沒有消費。</p><p>四位聖哲各自給了不同的答案，但方向是一致的：意義在於超越自我。孔子說仁，耶穌說愛，佛陀說慈悲，蘇格拉底說追求善。他們都在說：把目光從鏡子裡移開，看向窗外的人。</p>"}, {"day": 7, "title": "人文精神是什麼？不是什麼？", "body": "<p>說了六天，今天我們來把話說清楚。</p><p>人文精神（Humanism），這個詞被用濫了。有人說它是文藝復興的產物，有人說它是反宗教的世俗主義，有人說它就是「以人為本」，一個公司口號。我說的人文精神，不完全是任何一種。</p><p>人文精神，是相信人有尊嚴、有理性、有向善的能力；是相信每一個人的生命都值得被認真對待；是在面對苦難、不公、和死亡的時候，仍然選擇關懷而不是冷漠，仍然選擇思考而不是盲從。</p><blockquote>人文精神不是一套答案，而是一種態度：永遠把人放在第一位去思考問題。</blockquote><p>它不是什麼呢？人文精神不是反宗教的。孔子不是無神論者，耶穌當然不是，佛陀對神的問題保持沉默，但他也從未否認神的存在。人文精神與宗教可以並存，只要那個宗教也以人的尊嚴和福祉為核心。</p><p>人文精神不是浪漫主義。它不說人性本善，不說世界本是美好，不迴避衝突和黑暗。人文精神是清醒的，不是天真的。</p><p>人文精神也不是菁英的特權。它不需要學位，不需要哲學訓練。一個在地鐵上給老人讓座的年輕人，一個在暴雨中為陌生人撐傘的路人，都在實踐人文精神，只是他們可能沒有用這個名字稱呼它。</p><p>一百天的旅程，從今天正式開始。</p>"}]}, {"title": "第二章：蘇格拉底與古希臘", "articles": [{"day": 8, "title": "雅典城：民主的搖籃", "body": "<p>想像一個城市，面積大概只有香港的三分之一，人口在鼎盛時期不過三四十萬。但就是這個地方，在短短一兩百年間，誕生了索福克里斯的悲劇、帕德嫩神廟的建築、希羅多德的史學，以及蘇格拉底、柏拉圖、亞里士多德的哲學。這個城市，叫雅典。</p><p>雅典的故事告訴我們一件事：當一個社會給予人足夠的自由去思考和辯論，人類的潛能可以爆發到什麼程度。</p><p>公元前五世紀的雅典，建立了人類歷史上最早的民主制度之一。當然，我們必須誠實：那個「民主」是殘缺的。女性沒有投票權，奴隸沒有公民資格，外邦人被排除在外。真正享有民主權利的，只是雅典成年男性公民，大概佔總人口的一成左右。</p><blockquote>一個不完整的民主，仍然比沒有民主更能釋放人的創造力。這是雅典給我們最深的啟示。</blockquote><p>然而，即便是這個不完整的民主，已足以釋放出驚人的能量。公民可以在廣場公開辯論，可以批評政策，可以質疑傳統。思想在碰撞中產生火花，而不是在沉默中熄滅。</p><p>支撐這一切的，還有雅典的商業繁榮。作為愛琴海的貿易樞紐，雅典與埃及、波斯、義大利各地的商人往來，帶回的不只是貨物，還有不同的世界觀和思想。當一個社會不斷接觸「異見」，它就不得不思考：我們的方式，真的是唯一的方式嗎？</p><p>正是這樣的土壤，養育了蘇格拉底。</p>"}, {"day": 9, "title": "蘇格拉底之前的哲學家想什麼？", "body": "<p>哲學這個詞，來自希臘文「philosophia」，意思是「愛智慧」。但在蘇格拉底出現之前，希臘的哲學家們愛的，主要是另一種智慧——關於宇宙本質的智慧。</p><p>泰勒斯，公元前六世紀的米利都人，被後世尊為西方哲學之父。他的問題不是「人應該怎樣活」，而是「世界由什麼構成」。他的答案是：水。萬物的本原是水。這個答案今天看來幼稚，但背後的思維方式革命性：他不訴諸神話，不說「因為宙斯如此規定」，而是用觀察和推理去解釋世界。</p><p>赫拉克利特說，世界的本原是火，萬物都在流動，「你不能兩次踏進同一條河流」。德謨克利特更進一步，提出了驚人的原子論：萬物都由不可再分的微粒「原子」構成——這個想法要等到兩千年後的現代化學才得到科學驗證。</p><blockquote>他們的答案錯了，但他們的問法對了：用理性取代神話，用觀察取代權威。</blockquote><p>蘇格拉底出現，把這個問題倒過來了。他說：宇宙的秘密固然迷人，但如果你連自己都不了解，你又怎能了解宇宙？把哲學的目光從天空收回，先照進自己的靈魂，看清楚那裡有什麼。這一轉身，改變了西方哲學的方向。</p>"}, {"day": 10, "title": "蘇格拉底：把哲學帶回人間", "body": "<p>蘇格拉底長得不好看。扁鼻子、厚嘴唇、眼睛凸出、大腹便便，走路像一隻搖搖擺擺的水鳥。他不修邊幅，常年穿同一件衣服，據說冬天也赤腳走在雅典的石板路上。</p><p>但他一開口，人就停住了。</p><p>蘇格拉底從來不寫作。他的思想，全靠學生們的記錄才流傳下來，其中最重要的，是柏拉圖的對話錄。他的哲學不在書齋裡，在廣場上，在市集裡，在朋友的飯桌旁。他找人說話，問問題，追問，再追問，直到對方發現自己其實什麼都不知道。</p><blockquote>他說，他唯一知道的，就是他什麼都不知道。這句話不是謙虛，是哲學的起點。</blockquote><p>蘇格拉底看著雅典，心裡痛苦。他看見人們在追逐財富和榮耀的同時，把靈魂放在一旁，從未照料。他曾說，神給了他一個任務，要他成為雅典的「牛虻」——叮咬一頭懶洋洋的大馬，讓它保持清醒。他的工具，就是問題。不是答案，是問題。</p><p>一個不斷問問題的人，很難被操控，也很難自欺欺人。這，也許是哲學對生活最實際的貢獻。</p>"}, {"day": 11, "title": "什麼是蘇格拉底式提問？", "body": "<p>有一天，蘇格拉底在市集遇見一個將軍，叫拉刻斯。蘇格拉底問他：「你帶兵打仗多年，請問，什麼是勇氣？」</p><p>將軍自信地答：「就是在戰場上不退縮，堅守陣地。」</p><p>蘇格拉底說：「那麼，如果一個士兵為了誘敵深入而假裝撤退，然後反擊，那算不算勇氣？」</p><p>就這樣，對話繼續，將軍每給一個定義，蘇格拉底就找到一個反例，直到將軍發現，他以為自己最熟悉的東西，其實他根本說不清楚。</p><blockquote>這就是「蘇格拉底式提問」的核心：不是要打倒對方，而是要一起走向更深的真相。</blockquote><p>這種方法，希臘語叫「elenchus」，中文常譯為「產婆術」——蘇格拉底說，他的母親是助產士，幫助孕婦把孩子帶到世上；他自己也是助產士，幫助人們把藏在心裡的知識帶出來。</p><p>蘇格拉底式提問的精神，不是「我知道你錯了」，而是「讓我們一起找出哪裡不對」。它要求謙遜，要求真正的好奇，要求願意讓自己的想法被挑戰。</p><p>下一次當你確定某件事，不妨先問自己：我的根據是什麼？有沒有反例？我有沒有可能是錯的？這不是軟弱，這是思考的起點。</p>"}, {"day": 12, "title": "何謂公義？蘇格拉底的追問", "body": "<p>柏拉圖最長的著作，叫《理想國》。整本書其實只是在回答一個問題：什麼是公義？</p><p>一個叫特拉敘馬庫斯的詭辯學者態度強硬：「公義？公義就是強者的利益。統治者制定規則，規則服務統治者，這就是所謂公義。那是給弱者的安慰劑。」這個答案，在今天聽來一點也不陌生。</p><blockquote>蘇格拉底沒有大聲反駁。他問：「那麼，一個完全不公義的人，他能幸福嗎？」</blockquote><p>他帶著眾人思考：一個人，如果內心沒有秩序，只有慾望和權力的角逐，他的靈魂是什麼狀態？</p><p>蘇格拉底的結論是：不公義的人，靈魂是混亂的。他也許擁有外在的成功，但內心永遠在鬥爭，永遠不得安寧。真正的幸福，需要靈魂的和諧，而靈魂的和諧，需要公義。</p><p>兩千四百年後，心理學研究發現，那些長期欺騙、剝削他人的人，確實承受更高的焦慮水平和心理健康問題。蘇格拉底的直覺，有它的道理。</p><p>公義不只是政治問題，它也是一個關於你想成為什麼樣的人的問題。</p>"}, {"day": 13, "title": "何謂勇氣？比你想的複雜", "body": "<p>2022年，俄羅斯入侵烏克蘭後，烏克蘭總統澤連斯基拒絕了美國的撤離提議，留在基輔，每天在戰火中向國民發表演講。很多人說他有勇氣。</p><p>但同一年，一個護士，在高壓環境下仍然拒絕在病歷中填寫虛假數據，最終失去工作。有多少人注意到她的勇氣？</p><p>蘇格拉底問過一個將軍：什麼是勇氣？最終他們得出一個結論，勇氣不只是無畏，而是「對什麼值得恐懼，什麼不值得恐懼，有正確的判斷」。</p><blockquote>莽撞不是勇氣。真正的勇氣，需要智慧做底。</blockquote><p>亞里士多德後來把這個想法發展得更完整。他說勇氣是一種「中道」：懦弱（過分恐懼）和魯莽（毫不恐懼）都是極端，勇氣在兩者之間——在清醒評估危險之後，仍然選擇行動。</p><p>勇氣是可以練習的。亞里士多德相信美德不是天生的，是習慣養成的。承認恐懼，不等於懦弱。真正的勇氣，是感受到恐懼，然後仍然選擇。</p><p>今天，你有沒有一件事，你知道應該做，但一直在逃避？那個逃避的地方，也許就是你可以開始練習勇氣的地方。</p>"}, {"day": 14, "title": "未經檢驗的人生，沒有價值", "body": "<p>這大概是哲學史上最常被引用的一句話，也是最常被誤解的一句話。</p><p>「未經檢驗的人生，不值得活。」</p><p>蘇格拉底說這句話的時候，是在自己的審判現場。公元前399年，七十歲的他站在五百人的陪審團面前，被控「腐蝕青年思想」和「不敬神明」。他知道，只要他願意道歉，願意承諾不再哲學，他就能保住性命。</p><p>他拒絕了。他說：「我不能停止哲學。每天對你們談論美德和其他話題，檢驗自己也檢驗他人，這才是人最大的善。未經檢驗的人生，不值得活。」</p><blockquote>他寧願死，也不願意過一種停止思考的生活。這不是意氣，這是一個人對生命最深的理解。</blockquote><p>「檢驗」是什麼意思？不是自我批判，不是永無止境的懷疑自己。而是定期停下來，誠實地問：我現在走的這條路，是我真正選擇的嗎？我的信念，是我親自思考過的，還是被灌輸進來的？我對人對事的判斷，有沒有盲點？</p><p>這種「檢驗」在今天格外難。演算法給你看你已經相信的東西，社交媒體獎勵你在同溫層裡尋找認同，新聞循環讓你沒有時間沉澱，只有反應。蘇格拉底的挑戰，在今天仍然有效。</p>"}, {"day": 15, "title": "蘇格拉底之死：以生命為代價的哲學", "body": "<p>公元前399年的一個春日，雅典城的一間牢房裡，蘇格拉底和他的學生們坐在一起，談論靈魂不死的問題。那天，是蘇格拉底生命中最後的一天。</p><p>陪審團以360對140的票數判他有罪，判決是死刑。他的朋友克里托為他安排好了逃跑路線，錢也準備好了，船也等著了。蘇格拉底搖搖頭，說不。</p><p>他解釋：我在雅典生活了七十年，享受了這個城市給我的一切，包括它的法律。如果我只在法律對我有利的時候遵守它，在法律判我死刑的時候逃跑，那我之前對法律的尊重，算什麼？</p><blockquote>他不是認為判決是公正的。他是認為，一個人不能只在方便的時候才有原則。</blockquote><p>日落時分，典獄長帶來了毒堇汁。蘇格拉底平靜地接過，喝下去。他的學生們哭泣，他反而安慰他們：「哭什麼，我聽說人應該平靜地死去。」</p><p>他最後對老朋友克里托說：「我們欠了阿斯克勒庇俄斯一隻公雞，不要忘記還它。」死亡，是靈魂從肉體這場疾病中的痊癒。然後，他閉上眼睛。</p><p>蘇格拉底的死告訴我們：一個人真正相信的東西，是他願意為之付出代價的東西。所有的哲學，如果只停留在言語而不落入生命，都是空的。他死了，但他提出的問題，從此就再也沒有辦法被殺死。</p>"}, {"day": 16, "title": "柏拉圖：理想國是烏托邦嗎？", "body": "<p>蘇格拉底死後，他二十八歲的學生柏拉圖崩潰了。不只是悲傷，是幻滅。他親眼見證一個他認為最有智慧、最正直的人，被一個自稱民主的城市殺死。他帶著這份幻滅，離開雅典，到埃及、義大利各地遊歷十二年。回來之後，他開辦了自己的學校，叫「學園」（Academia）——這個詞，就是今天「學術」（academic）的源頭。</p><p>柏拉圖最重要的著作是《理想國》，核心問題只有一個：什麼樣的城邦，才是公義的？</p><blockquote>他的答案讓很多人不舒服：由哲學家來統治。</blockquote><p>柏拉圖的邏輯是這樣的：一個城市如同一個靈魂，需要理性、激情和慾望三個部分各司其職，相互協調。理性應該主導，激情輔助，慾望服從。對應到社會，就是哲學家（理性）統治，武士（激情）守衛，工匠商人（慾望）生產。</p><p>是烏托邦嗎？當然是。這樣的城邦從未存在過，也許永遠不會。但柏拉圖的《理想國》不是一份施政藍圖，而是一面鏡子——讓我們看清楚，當一個社會完全被私利和慾望主導時，它會變成什麼樣子。</p><p>他還留下了「洞穴的比喻」。我們都像住在洞穴裡的囚犯，只能看見牆上的影子，以為那就是真實。哲學，就是走出洞穴，去看真正的陽光的旅程。這個比喻，在社交媒體和演算法的時代，比任何時候都更貼切。</p>"}, {"day": 17, "title": "亞里士多德：什麼是幸福的人生？", "body": "<p>有一個問題，亞里士多德認為是所有問題的母問題：人，究竟為了什麼而活？</p><p>他的答案是：幸福。希臘文叫「eudaimonia」，但這個詞很難翻譯，因為它不是我們今天說的「happy」——那種短暫的愉悅感。Eudaimonia更接近「flourishing」，是一種持久的、全面的、人作為人應有的蓬勃狀態。</p><blockquote>但他立刻補充：幸福不是一種感覺，是一種活動。不是你擁有什麼，而是你如何活著。</blockquote><p>他提出了「美德」（arete）的概念——人的美德是發揮人最獨特的能力：理性。一個充分運用理性，在關係中、在工作中、在公共生活中都追求卓越的人，就在走向eudaimonia。</p><p>他的另一個洞見，現代科學已反覆證實：「我們是習慣的總和」。美德不是天才，是練習。勇敢的人，是因為反覆在需要勇氣的時刻選擇了勇敢。慷慨的人，是因為無數次選擇了給予。沒有人天生完美，但每個人都可以透過有意識的練習，慢慢成為更好的自己。</p>"}, {"day": 18, "title": "斯多葛派：命運不可控，心境可以", "body": "<p>馬可·奧理略是羅馬皇帝，統治著當時世界上最龐大的帝國，軍隊、財富、權力，應有盡有。但他私下寫的日記，充滿了另一種聲音：「今天我遇見了一個忘恩負義的人，一個無禮的人，一個說謊的人。但我記得，我和他們同屬人類，我們都有犯錯的能力。我不應該驚訝，也不應該憤怒。」這本日記，後來以《沉思錄》之名流傳，成為斯多葛哲學最動人的文本之一。</p><p>斯多葛哲學由雅典的芝諾創立於約公元前300年，後來在羅馬發揚光大。它的核心思想可以用一句話概括：分清楚什麼在你的控制之內，什麼不在。</p><blockquote>天氣、他人的行為、命運的安排——這些不在你的控制之內。你的判斷、你的選擇、你對事物的態度——這些在你的控制之內。把精力放在後者，放下前者。</blockquote><p>斯多葛思想中有一個練習，叫做「預想最壞」（premeditatio malorum）——在每天早上，想像今天可能會出現的困難、失敗、甚至最壞的情況。不是為了悲觀，而是為了準備，為了提醒自己：即使最壞的情況發生，我依然有能力選擇如何回應。</p><p>斯多葛的奴隸哲學家愛比克泰德說：「人不是被事情本身困擾，而是被他們對事情的看法困擾。」兩千年後，現代認知行為治療（CBT）的理論基礎，幾乎和這句話完全吻合。</p>"}, {"day": 19, "title": "伊壁鳩魯：快樂是什麼？", "body": "<p>「伊壁鳩魯主義」這個詞，今天常常被用來形容縱情享樂、美食美酒、感官放縱的生活方式。但伊壁鳩魯本人的生活，幾乎是這個形象的完全相反。他住在雅典郊外一個叫「花園」的小社區，飲食簡樸——麵包、橄欖、偶爾有一小塊乳酪，他就說這已經是奢侈。</p><p>他的核心問題是：什麼是快樂？他的答案，出人意料地節制。</p><blockquote>伊壁鳩魯認為，真正值得追求的，是靜態的快樂——一種深沉的寧靜狀態，沒有痛苦，沒有焦慮，內心平和。而達到它的方法，不是更多，而是更少。</blockquote><p>伊壁鳩魯列出了他認為幸福最需要的三件事：自由（不受強制的生活）、友誼（深刻的人際連結）、哲學思考（理解世界和自己）。注意，財富和名聲都不在這個清單上。</p><p>兩千三百年後，心理學家研究幸福的來源，發現最持久的幸福感確實來自社會連結、目的感和自主性——而不是財富超過某個水平之後的進一步增加。伊壁鳩魯，又一次，比時代早了兩千年。</p><p>你生命中的「花園」在哪裡？那個讓你感到真正寧靜和滿足的地方，是什麼？</p>"}, {"day": 20, "title": "古希臘哲學怎樣影響今天？", "body": "<p>1945年，二戰剛結束，英國哲學家波普爾在流亡途中寫完了《開放社會及其敵人》，書中激烈批判柏拉圖的「哲學王」理念，認為它是極權主義的思想根源之一。一個活在兩千年前的哲學家，在二十世紀仍然重要到值得一本書來反駁。這說明古希臘哲學從未真正成為歷史。</p><blockquote>古希臘哲學最深的影響，不在任何一個具體的制度或學說，而在一種態度：用理性去追問，不把任何答案視為理所當然。</blockquote><p>當你去看醫生，醫生在做診斷時的思維過程——提出假設，尋找證據，排除可能性——這是亞里士多德邏輯學的遺產。當法庭要求控辯雙方都有陳述機會，這是蘇格拉底辯證法的回響。當心理治療師問你：「你對這件事的感受，是基於事實還是詮釋？」這是斯多葛哲學換了一件現代的外衣。</p><p>這種求真的態度，成為科學方法的前身。伽利略、牛頓、達爾文，他們做的事，在精神上是蘇格拉底式的：不相信權威，只相信證據和邏輯。</p><p>當然，古希臘也留下了陰影。它對奴隸制的默認，對女性的排斥，都是我們今天必須承認和批判的。偉大的思想，和時代的局限，往往並存在同一個人身上。這正是閱讀古人的正確方式：既不盲目崇拜，也不因為它的局限而全盤否定。</p>"}, {"day": 21, "title": "求真與愛智：西方哲學的種子", "body": "<p>這是古希臘章節的最後一天。我想說一件很小的事。</p><p>有一年，我在雅典衛城下面的廣場遺址漫步。那裡現在是一片考古公園，殘破的石柱，磨損的石板路，幾棵橄欖樹。遊客不多，安靜得出奇。我站在那裡，想著：就是在這裡，或者附近某個地方，蘇格拉底走過，停下來，問一個陌生人：你覺得什麼是正義？</p><p>兩千五百年了。那些石板路還在。那些問題，還在。</p><p>古希臘哲學留給我們的，不是一套固定的答案，而是兩顆種子。第一顆，是求真的精神。不把傳說當作真相，不把權威當作真理，用觀察、用邏輯、用不斷的追問去接近真實。</p><blockquote>第二顆，是愛智的謙遜。知道自己不知道，才能繼續學習。確信自己已經知道，就是停止思考的開始。</blockquote><p>這兩顆種子，在很長的歷史裡，幾乎在歐洲失傳。幸好，它們被保存在拜占庭的圖書館，被阿拉伯學者翻譯和傳誦，在巴格達的智慧宮裡繼續燃燒，等待著一千年後的文藝復興把它們重新帶回歐洲。</p><p>知識的傳承，從來不是直線的。它曲折，它有時幾乎熄滅，但它沒有死。</p><p>下一週，我們要離開地中海的海風，向東，走入恆河邊的森林，去找另一個人——他坐在一棵樹下，正在試圖弄明白苦難從何而來。他的名字，你一定聽過。</p>"}]}, {"title": "第三章：佛陀與印度智慧", "articles": [{"day": 22, "title": "佛陀出生的世界是什麼樣的？", "body": "<p>公元前五世紀的印度，是一個令人窒息的世界。不是因為它貧窮，而是因為一套幾乎無法撼動的社會秩序——婆羅門教的種姓制度，將人從出生那一刻起就分成四個等級。你生在哪個種姓，你就是那個種姓，一生不變。婆羅門祭司壟斷了神聖知識，壟斷了解釋苦難的話語權：你受苦，是因為你前世造業。</p><blockquote>這是一套把不平等神聖化的制度。它的殘酷，在於讓受苦的人相信，自己的苦難是活該的。</blockquote><p>在這樣的世界裡，也有反抗的聲音。公元前六至五世紀，印度出現了一批叫做「沙門」的苦行者——他們離開家庭，拒絕婆羅門的權威，追問：苦難的根源究竟在哪裡？解脫究竟是否可能？</p><p>就在這個背景下，一個貴族家庭的孩子出生了。他的父親是釋迦族的酋長，有星象師預言：這個孩子，要麼成為轉輪聖王，要麼出家，成為覺悟者。父親希望他成為前者，為他建造了一個完美的世界，讓他遠離所有的痛苦。但那個完美的世界，終究有一天，出現了裂縫。</p>"}, {"day": 23, "title": "王子為何出家？見到了什麼？", "body": "<p>悉達多·喬達摩的童年，像一個精心設計的謊言。父親為他建造了三座宮殿，宮裡有花園、有樂師、有舞者。僕人們奉命，不讓任何令人不快的景象出現在王子眼前。沒有老人，沒有病人，沒有乞丐，沒有死亡。</p><p>然後，有一天，他命令車夫帶他出城。他在城外第一次見到了一個彎腰駝背的老人；第二次出城，見到一個病人，躺在路邊，身體扭曲；第三次，見到一具屍體。</p><blockquote>他問車夫：這個人為什麼這樣？車夫說：老爺，這就是老。這就是病。這就是死。所有人都會這樣。包括您。</blockquote><p>「包括您。」這三個字，擊穿了宮殿的牆壁。</p><p>第四次出城，他見到了一個沙門，面容平靜，雖然衣衫簡陋，卻有一種難以言說的安詳。那一夜，悉達多二十九歲，他看著熟睡中的妻子和嬰兒，悄悄離開，走進了黑夜。</p><p>後世對這個決定有很多批評：他拋棄了妻兒，自私，不負責任。這個批評不是沒有道理。但也許，一個人，被世界的苦難震撼到無法繼續假裝，選擇把尋找答案當作自己的使命——這種衝動，在人類歷史上從未消失過。</p>"}, {"day": 24, "title": "菩提樹下：悟道是一種怎樣的體驗？", "body": "<p>離開王宮之後，悉達多先拜師學禪定，達到了當時印度禪修傳統的最高境界。但他感到，苦難的根本問題仍然沒有被解決。他轉向苦行，把肉身折磨到極限，六年後幾乎餓死，卻依然沒有找到答案。</p><p>有一天，一個牧羊女路過，遞給他一碗乳糜。悉達多接受了，喝下去。</p><blockquote>但悉達多想通了一件事：極端的縱欲不能帶來解脫，極端的苦行也不能。真正的道路，在兩個極端之間——他稱之為「中道」。</blockquote><p>喝完那碗乳糜，他走到一棵畢波羅樹下，盤腿坐下，發誓：不得解脫，絕不起身。</p><p>那一夜，傳說中有魔王波旬前來擾亂，用恐懼、用慾望、用疑惑，試圖打斷他的修行。悉達多逐一面對，不逃避，不被捲走，只是如實地觀察：這是恐懼，這是慾望，這是念頭——它們升起，然後消散。</p><p>黎明時分，三十五歲的悉達多，在那棵後來被稱為「菩提樹」的樹下，徹底覺悟。他覺悟了什麼？不是一個神的啟示，而是一個關於苦難和解脫的洞見，清晰得像一個他一直在找卻從未看見的事實，忽然攤開在眼前。然後他站起來，開始走向人群。從此，他有了一個新的名字：佛陀。覺悟的人。</p>"}, {"day": 25, "title": "四聖諦：苦從何來？", "body": "<p>佛陀第一次說法，是在鹿野苑，對象是那五個曾經拋棄他的同伴。他說的，後來被稱為「四聖諦」。</p><p>第一諦，苦諦：生命中有苦（dukkha）。生老病死是苦，求不得是苦，愛別離是苦。這不是悲觀主義，而是如實的觀察。</p><p>第二諦，集諦：苦是有原因的，那個原因是「渴愛」（tanha）——對快樂的渴求，對存在的執取。</p><blockquote>注意他說的不是「慾望本身是惡」，而是「渴愛——那種執著的、扭曲的、永不滿足的追逐——才是苦的根源」。</blockquote><p>第三諦，滅諦：既然苦有原因，原因消除，苦就可以消除。這個苦滅的狀態，叫「涅槃」（nirvana）——熄滅渴愛的火焰。這不是死亡，不是虛無，而是一種從燃燒中解脫出來的清涼與自由。</p><p>第四諦，道諦：有一條走向滅苦的道路。那條路，就是八正道。</p><p>這四諦的結構，和古印度的醫學診斷格式驚人地相似：確認病狀（苦），找出病因（集），確認病可以治（滅），提出療法（道）。佛陀不是在宣揚神秘主義，他是在做診斷。</p>"}, {"day": 26, "title": "八正道：解脫的路怎麼走？", "body": "<p>如果四聖諦是診斷，八正道就是處方。但它不是一張清單，要你逐項打勾完成。它更像一個車輪的八根輻條——每一根都支撐著整個輪子，缺一不可，而且要同時轉動。</p><p>八正道分為三個層次。第一個層次是智慧：正見（對世界和苦難有正確的理解）、正思維（以不貪、不嗔、不害的心念思考）。第二個層次是戒律：正語（不說謊、不惡言）、正業（不殺生、不偷盜）、正命（以不傷害生命的方式謀生）。</p><blockquote>第三個層次是禪定：正精進（持續努力，不鬆懈）、正念（清醒地覺察當下的身心狀態）、正定（通過禪定培養專注和洞見）。這是深入內心的工作。</blockquote><p>其中「正念」（sati）在今天已成為一個全球現象。從矽谷的企業培訓到醫院的壓力管理課程，「mindfulness」無處不在。它的核心很簡單：把注意力放在當下，觀察自己的思想、情緒和感受，不加評判，只是如實地看見。</p><p>現代神經科學的研究發現，定期練習正念冥想，可以改變大腦結構，增厚與注意力和情緒調節相關的皮質層，降低焦慮和抑鬱的症狀。</p><p>但佛陀的正念，不只是減壓工具。它是一個更深層的邀請：去看清楚，自己的執著是什麼樣子，苦是怎樣在自己的心裡生起的。不是為了消滅感受，而是為了不再被感受淹沒。看清楚，才能自由。</p>"}, {"day": 27, "title": "無常：世界為何不停在變？", "body": "<p>有一個故事，我一直覺得是佛教最美的故事之一。</p><p>一個母親，抱著剛剛死去的孩子，走遍全村，求人給她一帖藥，讓孩子起死回生。最後有人告訴她，去找佛陀。她抱著孩子，跑到佛陀面前，哭著說：求您救救我的孩子。</p><p>佛陀說：我可以幫你。但你要先為我找一樣東西：一把從來沒有死過人的家庭取來的芥菜籽。</p><p>母親放下孩子，跑去找。她挨家挨戶敲門，問：你家裡有沒有死過人？每一家都說：有。她走遍了整個村子，沒有找到那把芥菜籽。</p><blockquote>佛陀問：芥菜籽找到了嗎？她搖搖頭，說：我明白了。死亡，不只是我一個人的事。</blockquote><p>這個故事說的，是佛教三法印之一：無常（anicca）。世間萬物，都在生滅流變，沒有任何東西是永恆不變的。我們大部分的痛苦，都來自拒絕接受這個事實。佛陀說，痛苦不來自失去本身，而來自以為不會失去。</p><p>接受無常，不是放棄愛，不是變得冷漠。而是一種更清醒的愛：因為知道這一刻會過去，所以更珍惜這一刻；因為知道分離是必然，所以更認真地在一起。</p>"}, {"day": 28, "title": "執著是萬苦之源", "body": "<p>讓我說一件你也許有過的經歷。你得到了一份很想要的工作，或者一段很渴望的感情。在那個得到的瞬間，你很快樂。但那種快樂，沒有你預期的那麼長久。很快，你開始擔心失去它，或者開始想要更多，或者發現它並沒有帶來你以為的那種滿足。</p><p>佛陀說：這不是你的問題。這是執著（upādāna）的本質。</p><blockquote>佛陀觀察到，執著有一個根本的謊言：它假設有一個穩固的「我」，在緊抓著一個穩固的「它」。但事實上，「我」和「它」都在不停地變化。</blockquote><p>現代心理學的「享樂適應」（hedonic adaptation）理論印證了這個觀察：人類有一種驚人的能力，能夠快速適應新的情況。買了新車，三個月後它就只是一輛車；升了職，半年後那個興奮感消失，新的不滿足出現。</p><p>佛陀不是說我們不應該有目標，不應該愛人，不應該努力。他說的是：如果你把幸福的條件完全押注在某一樣外在事物上，你就把自己的平靜交給了無法控制的力量。</p><p>那麼，有沒有一種方式，可以愛，可以追求，可以全情投入，但不執著？佛陀說：有。當你真正看清楚「無我」（anatta）的真相，執著就會自然鬆開。無我，是佛教最難也最深的概念。我們明天繼續。</p>"}, {"day": 29, "title": "空性：萬物互相依存的意思", "body": "<p>「無我」（anatta），很多人第一次聽到，會覺得沮喪：什麼叫沒有「我」？</p><p>佛陀沒有說你不存在。他說的是：你以為的那個固定的、獨立的、永恆不變的「我」，是一個概念，不是事實。他把人拆解成五個聚合（五蘊）：色（肉身）、受（感受）、想（感知）、行（意志和習慣）、識（意識）。這五個部分不斷流動，不斷變化，彼此互相依存，沒有一個永恆不變的「主人」。</p><blockquote>「我」不是一個固定的東西，而是一個不斷流動的過程。就像一條河，你說它是「同一條河」，但裡面的水每一刻都不同。</blockquote><p>這個洞見，後來被佛教哲學家龍樹（Nāgārjuna）在公元二世紀發展成「空性」理論。空性說的不是「什麼都不存在」，而是「萬物都沒有獨立自存的本性」——一切事物的存在，都依賴於其他事物的存在。</p><p>一朵花，依賴陽光、水、泥土、種子、農夫的勞動、雲、雨，乃至整個宇宙的條件才能存在。把這些條件全部抽走，花在哪裡？沒有獨立的「花」，只有無數條件的匯聚。</p><p>現代生態學用另一種語言說著同樣的事：沒有任何生命體可以脫離它的生態系統而存在。空性，聽起來像虛無，其實是連結。當你真正理解萬物互相依存，你就很難對他人的苦難漠然——因為他的苦難，和你的存在，並不是毫無關係的兩件事。這，就是慈悲的哲學根基。</p>"}, {"day": 30, "title": "慈悲：為何不能獨善其身？", "body": "<p>有一個問題，常常被問：佛教不是要人斷除執著嗎？那麼愛人，是不是也是一種執著，也應該放下？這是一個很重要的誤解，值得認真釐清。</p><p>佛教說的「慈悲」，梵文是 karunā 和 mettā。Karunā 是悲，看見苦難而生起的心痛，以及想要消除那個苦難的衝動。Mettā 是慈，一種無條件的善意和溫柔，希望一切眾生都能快樂。</p><blockquote>佛教傳統有一個修行叫「慈心觀」（mettā meditation）：先對自己生起善意，再擴展到你愛的人，再到陌生人，最後到你的敵人，乃至一切眾生。</blockquote><p>這個擴展，不是勉強自己假裝喜歡所有人，而是練習把那份心的容量慢慢撐大。研究發現，定期練習慈心觀，可以增加正向情緒、減少偏見、甚至緩解慢性疼痛。</p><p>但佛陀的慈悲，還有一個更深的哲學根基——就是空性。如果萬物互相依存，那麼「我只顧自己」在根本上就是一個錯誤的假設。你的存在，本來就和所有人的存在交織在一起。</p><p>佛陀在覺悟之後，本可以就此離去，在某個寧靜的山林裡度過餘生。但他沒有。他走向人群，因為他的慈悲心讓他不能外出而不回頭。這，才是「獨善其身」最終不夠的原因：不是因為規則不允許，而是因為一個真正覺悟的人，看見他人的苦難，就像看見自己的苦難。</p>"}, {"day": 31, "title": "菩薩道：布施、忍辱、精進", "body": "<p>佛陀在世說法四十五年，他的教導後來由弟子們記錄整理，形成了浩瀚的佛教典籍。但在他死後大約五百年，佛教內部出現了一場深刻的反思。一批僧侶和學者開始問：如果覺悟的目標只是自己解脫，那和自私有什麼分別？</p><p>這場反思，催生了大乘佛教，以及它的核心精神：菩薩道。菩薩道的理想，不是盡快讓自己解脫，而是發下「菩提心」——誓願在所有眾生都得到解脫之前，自己不獨自離去。</p><blockquote>觀世音菩薩是最廣為人知的形象：她本已可以進入涅槃，卻選擇留在苦難的世間，聆聽眾生的呼聲，伸出援手。她的存在，是一個關於慈悲的形象語言。</blockquote><p>要走菩薩道，需要修行六種「波羅蜜」（pāramitā）：布施（dāna）——給予，不只是財物，也包括時間、關注；忍辱（ksānti）——在面對傷害、委屈、不公平時，保持心的穩定，不被憤怒吞沒；精進（vīrya）——持續努力，不因挫折而放棄；以及禪定（dhyāna）、智慧（prajñā）和般若——對空性的直接洞見。</p><p>菩薩道的美麗，在於它把個人的修行和對世界的責任完全結合在一起。你的覺悟，不是要讓你逃離世界，而是讓你更有能力和更有智慧地留在世界裡，成為別人的依靠。</p>"}, {"day": 32, "title": "大乘佛教：佛陀本人會認得嗎？", "body": "<p>讓我說一件可能讓你不舒服的事。</p><p>今天很多人拜的那尊金光閃閃、端坐蓮花、法相莊嚴的佛像，和兩千五百年前那個在樹下喝乳糜、赤腳走路、用問題而不是奇蹟去感化人的悉達多，之間的距離，可能比我們以為的更遠。</p><p>佛陀本人，對宗教儀式是保持距離的。他從不說自己是神，也不鼓勵人崇拜他。他說：「不要因為我說了，就相信。用你自己的經驗去驗證。」</p><blockquote>佛陀去世後數百年，各種佛教派別相繼出現，不同的詮釋、不同的儀軌、不同的宇宙論。到了大乘佛教，出現了無數的佛和菩薩，有了前世故事，有了淨土，有了神通。</blockquote><p>這不全是壞事。神格化的佛菩薩，給了無數普通人一個情感依靠的對象。但我們也必須誠實地承認：當宗教變成儀式，當儀式取代了思考，當人們燒香拜佛求的是考試及格、股票升值，而不是對苦難本質的理解——這距離佛陀原來的教導，已經很遠了。</p><p>歷史上每一位偉大的思想家，都面臨同樣的命運：他們的追隨者把他們的話語變成教條，把他們的精神變成制度。這是提醒我們：每一代人，都有責任回到源頭，自己去讀，自己去想，自己去驗證。</p>"}, {"day": 33, "title": "佛教為何在印度消失？", "body": "<p>這是歷史上最弔詭的故事之一：佛教誕生於印度，卻在印度幾乎完全消失，反而在它從未誕生的地方——中國、日本、韓國、東南亞——繁榮生長了兩千年。</p><p>原因是複雜的。第一，婆羅門教的反彈與吸收。公元八至九世紀，印度教的哲學家商羯羅崛起，吸收了佛教的部分概念，同時批評佛教的「無我」論，重新確立了印度教的哲學地位。</p><blockquote>第二，更致命的打擊來自外部。公元1193年，那爛陀大學被伊斯蘭軍隊摧毀——那是當時世界上最偉大的學術中心之一，藏有無數珍貴典籍，在一把火中化為灰燼。一旦寺院被毀，僧侶被殺，傳承就中斷了。</blockquote><p>第三，佛教在印度逐漸變得精英化，越來越難以和普通人的日常生活連結。而印度教的神明、節慶、儀式，更貼近人心。</p><p>這個故事告訴我們：再偉大的思想，如果失去了紮根於普通人生活的能力，都可能消失。佛陀明白這一點。他用比喻說法，用故事說法，用聽眾能理解的語言說法。後來的佛教，有時忘記了這一點。</p>"}, {"day": 34, "title": "佛教傳入東亞：填補了什麼空缺？", "body": "<p>公元一世紀前後，佛教沿著絲綢之路，越過帕米爾高原，進入中國。它遇到的，是一個已經有深厚思想傳統的文明。儒家管理倫理和社會秩序，道家提供對自然和宇宙的玄想。但有一樣東西，它們都沒有認真回答：死亡之後，是什麼？苦難的終極意義，是什麼？佛教帶來的，正是這些問題的答案。</p><p>佛教進入中國，經歷了一個漫長的「漢化」過程，吸收了道家的語言，吸收了儒家的倫理框架，再加上中國人對實用性的偏好，慢慢演變成了具有中國特色的佛教。</p><blockquote>其中最獨特的，是禪宗。它拋開了繁複的哲學，回到最直接的問題：如何在當下這一刻體驗覺悟？它的方法不是閱讀典籍，而是「公案」——那些看似荒謬的問答，比如「一隻手拍掌是什麼聲音？」</blockquote><p>禪宗說：覺悟不在書裡，不在儀式裡，在你洗碗、喝茶、走路的每一個當下。這個精神，和佛陀最初的教導，其實是一脈相承的。</p><p>佛教傳入日本，孕育了禪的美學——侘寂（wabi-sabi），對不完整、無常、質樸之美的欣賞，滲透進日本的建築、花道、茶道、庭院設計，成為一種生活哲學。儒家補充了佛教在入世倫理上的不足，佛教補充了儒家在形而上和死亡問題上的沉默。兩者在東亞文化裡相互滋養了兩千年。</p>"}, {"day": 35, "title": "佛陀的慈悲心，今天還有用嗎？", "body": "<p>讓我用一個很現代的場景來結束這兩週的佛陀之旅。</p><p>2020年，新冠疫情的高峰期，香港一家醫院的深切治療部。一個護士，每天穿著厚厚的防護裝備，照料那些病危的患者，很多人在彌留之際，身邊沒有家人。規定不允許家屬探訪。那個護士，有時會握著病人的手，坐在床邊，讓他們知道，走的時候，有人陪著。沒有人要求她這樣做。她這樣做，只是因為她不忍心。</p><p>這，就是佛陀說的慈悲。不是廟裡的香火，不是早晚的課誦，而是在那個具體的、當下的時刻，看見面前一個人的苦難，心裡有所觸動，然後伸出手。</p><blockquote>佛陀最後的話，據說是：「萬物皆無常，勤加精進。」不是說等到你完全覺悟了再行動，而是在你還在路上的時候，繼續走，繼續努力。</blockquote><p>兩千五百年後，神經科學家發現，人類大腦天生具有「鏡像神經元」——當我們看見他人痛苦，大腦中與痛苦相關的區域會啟動，就像自己在痛一樣。慈悲，不只是宗教的要求，是人類神經結構的一部分。</p><p>在一個越來越傾向於把人化為數據、把關係化為互動的時代，慈悲是一種抵抗。佛陀的慈悲心，今天不只有用，今天更需要。</p><p>下週，我們離開恆河，走向黃河。一個沒落貴族的孩子，生在一個禮崩樂壞的時代，用一生去實踐一個他相信的字：仁。他的名字，叫孔丘。</p>"}]}, {"title": "第四章：孔子與中國人文", "articles": [{"day": 36, "title": "孔子的時代：禮崩樂壞的世界", "body": "<p>公元前551年，孔丘生於魯國，今天山東省曲阜一帶。周天子的權威已是一個空殼，各諸侯國明爭暗鬥，強吞弱，大欺小。在魯國國內，三個世家大族實際掌握了政權，架空了國君。而這三家之下，又有家臣趁機作亂，以下犯上。</p><p>孔子後來用四個字形容這個時代：禮崩樂壞。「禮」，在周代不只是禮貌，它是整套社會秩序的總稱——貴賤有別，長幼有序，君臣父子各有其位，各有其責。</p><blockquote>孔子親眼見到季氏在自家庭院裡，用只有天子才能用的八佾之舞，憤慨地說：「是可忍，孰不可忍！」</blockquote><p>他的憤慨，不只是對規矩被破壞的不滿。他看見的，是一種更深層的潰爛：當人們不再遵守任何共同的規範，當權力成為唯一的語言，社會就失去了讓人安身立命的基礎。強者橫行，弱者無告，每個人都活在不安之中。</p><p>這樣的世界，我們並不陌生。「強者制定規則，弱者默默承受，共同的道德底線不斷下移」——這樣的描述，放在任何一個時代，都不會完全過時。</p><p>面對這樣的世界，孔子選擇了一件更難的事：回到人心，重建秩序，從內而外。這個選擇，貫穿了他的一生。</p>"}, {"day": 37, "title": "百家爭鳴：孔子只是其中一家", "body": "<p>我們今天習慣把孔子放在一個特殊的位置——中國文化的代表，儒家的宗師，萬世師表。但在他活著的時候，他只是眾多思想家之中的一個。</p><p>春秋戰國時代的思想市場，用「百家爭鳴」來形容，並不誇張。墨家說：兼愛非攻。道家說：無為而治。老子認為，人為的制度和道德規條，本身就是問題的一部分。法家說：用法律和刑罰來治國。人性本自私，靠道德教化是天真的。後來秦始皇統一天下，用的就是法家的路線。</p><blockquote>孔子面對這些競爭對手，從未說自己是唯一正確的。但他堅持自己的路：不是法，不是兵，不是回歸自然，而是「仁」。</blockquote><p>他相信，一個社會的根本問題，不是制度設計，不是法律條文，而是人心。如果人心有仁，制度才有意義；如果人心無仁，再好的制度也會被扭曲。</p><p>這個洞見，和今天我們觀察政治的一個常識不謀而合：制度固然重要，但運作制度的人，才是決定性的變數。百家爭鳴，是中國思想史上最自由、最有活力的時代。它提醒我們：多元聲音共存，才是健康思想生態的樣子。</p>"}, {"day": 38, "title": "仁：孔子哲學的核心是什麼？", "body": "<p>《論語》裡，「仁」字出現了一百零九次。但奇怪的是，孔子幾乎從不給「仁」一個固定的定義。</p><p>不同的學生問他什麼是仁，他給出不同的答案：顏淵問仁，他說：克己復禮為仁。樊遲問仁，他說：愛人。仲弓問仁，他說：己所不欲，勿施於人。這是因材施教——他看見不同的學生有不同的缺失，給出最切合那個人的答案。</p><blockquote>仁，首先是一種對他人的在乎。不是抽象的「愛全人類」，而是在具體的關係裡，真正看見面前的這個人，感受他的需要，願意為他多想一步。</blockquote><p>「己所不欲，勿施於人」——孔子稱之為可以終身奉行的一個字：恕。值得注意的是，耶穌也說過幾乎相同的話：「你們願意人怎樣待你，你也要怎樣待人。」孔子說「勿施」，耶穌說「要施」，一個是消極表述，一個是積極表述，方向略有不同，但核心精神驚人地相似。</p><p>仁的另一個面向，是它不是天才的特權。孔子說：仁遠乎哉？我欲仁，斯仁至矣。仁，難道很遙遠嗎？我想要仁，仁就來了。這說明，仁不是一個只有聖人才能企及的高峰，它是每個人此刻就可以選擇的方向。</p>"}, {"day": 39, "title": "禮：規範背後的深意", "body": "<p>很多人讀到孔子說「克己復禮」，心裡有一種抗拒。克制自己？回歸禮制？這聽起來像是叫人壓抑個性，服從規矩，把自己塞進一個別人設計的框架裡。</p><p>周代的「禮」，確實包含了大量具體的儀式規範。但孔子看中的，不是這些外在形式，而是「禮」背後的精神。</p><blockquote>他說：禮云禮云，玉帛云乎哉？樂云樂云，鐘鼓云乎哉？禮，難道就是那些玉器絲帛嗎？形式之下，必須有一顆真實的心。</blockquote><p>「禮」的深意，是承認我們活在關係之中，而關係需要一些共同的語言和規範，才能運作。你每天早上跟同事說「早晨」，不是因為法律規定，而是因為這個小小的儀式，維繫著一種基本的人際溫度，讓辦公室不只是一個共用空間，而是一個有人氣的地方。這就是禮的最日常的版本。</p><p>更深一層：禮是自我管理的工具。孔子說「克己復禮」，不是叫你消滅自我，而是叫你管理自我的衝動——憤怒的衝動，傲慢的衝動，怠惰的衝動——讓自己的行為符合一個更高的標準。</p><p>現代心理學把這個能力叫做「自我調節」（self-regulation），研究發現它和學業成就、人際關係、身體健康都有密切關係。那個著名的「棉花糖實驗」，測試的正是孩子克制即時滿足的能力。孔子說的「克己」，和這個能力，其實是同一回事。</p>"}, {"day": 40, "title": "君子：孔子心目中的理想人格", "body": "<p>「君子」這個詞，在孔子之前，意思很簡單：貴族的兒子，有身份地位的人。孔子做了一件革命性的事：他把「君子」從一個血統的稱謂，變成了一個道德的稱謂。你的父親是不是貴族，和你是不是君子，從此沒有必然關係。君子，是一種人格的成就，是任何人透過立志和努力都可以達到的狀態。</p><p>孔子在《論語》裡，描繪了君子的許多面貌。君子不器——君子不把自己局限在某一種功能或技能裡，而是追求全面的人格發展。君子和而不同——能夠和不同意見的人和平共處，但不為了和諧而放棄自己的立場。</p><blockquote>君子喻於義，小人喻於利。遇到選擇時，君子先問：這樣做對不對？小人先問：這樣做有沒有好處？</blockquote><p>這個對比，不是說利益不重要，或者君子不食人間煙火。而是說，當義和利衝突的時候，君子的選擇是義。</p><p>孔子的君子理想，不是要你成為聖人，不是要你完美無缺。它只是問你一個問題：你想成為什麼樣的人？然後，你今天的選擇，有沒有在朝著那個方向走？</p>"}, {"day": 41, "title": "每個人都是道德主體", "body": "<p>公元前五世紀的世界，大部分文明都有一個共同的預設：普通人，不需要思考道德，也沒有資格思考道德。道德和宗教是祭司的事，是貴族的事，是統治者的事。普通人只需要服從。</p><p>孔子的立場，在這個背景下，顯得格外不同。他說：性相近也，習相遠也。人的本性，生來是相近的，是後天的習慣和環境，把人分開了。這句話蘊含著一個深刻的平等觀：道德修養的能力，不是某個階層的特權，是每個人生來就有的潛力。</p><blockquote>他說：為仁由己，而由人乎哉？行仁，是靠自己的，難道靠別人嗎？沒有任何外在的力量可以替你變得更好，也沒有任何外在的力量可以阻止你變得更好。道德的責任，在你自己身上。</blockquote><p>這個觀念，放在今天，聽起來理所當然。但在兩千五百年前，它是一個深刻的宣言：每一個人，無論出身，無論地位，都是一個獨立的道德主體，都有行善的能力，都有為自己的行為負責的義務。</p><p>孔子的學生，來自不同的社會背景。顏淵家境清貧，「一簞食，一瓢飲，在陋巷」，但孔子稱他為最接近「仁」的人。出身不是障礙，態度才是。</p>"}, {"day": 42, "title": "孔子怎樣教學生？因材施教的智慧", "body": "<p>有一個故事，我每次讀都覺得孔子很可愛。</p><p>學生子路問：聽到一件應該做的事，要馬上去做嗎？孔子說：你父親和兄長還在世，怎麼能聽到就馬上行動呢？要先請教他們。</p><p>另一個學生冉有問了同樣的問題。孔子說：當然，聽到就馬上去做。</p><p>站在一旁的公西華困惑了，問孔子：為什麼同樣的問題，您給了不同的答案？</p><blockquote>孔子回答：冉有這個人做事畏縮，所以我推他一把；子路這個人膽子太大，所以我拉他一下。這就是「因材施教」。不是給所有人同一個答案，而是看見每一個人的具體處境，給出最適合那個人此刻需要的引導。</blockquote><p>孔子有學生三千，其中被稱為「賢人」的有七十二位。孔子從不要求他們成為同一種人。他對顏淵，是深深的惋惜和珍視——顏淵英年早逝，孔子哭道：天喪予！天喪予！他對子路，是又愛又頭疼——子路死於衛國的政變，孔子從此不再吃切肉，因為子路死時身體被剁成肉醬。這份痛苦，不是老師對學生，更像是父親對兒子。</p><p>孔子說，教育不是灌輸，是喚醒。他的課堂沒有固定的教材，只有對話，只有問題，只有對每一個人的認真觀察。這種尊重，是一切真正的教育的起點。</p>"}, {"day": 43, "title": "孔子的一生：順逆之間的堅持", "body": "<p>孔子的一生，如果要用一句話概括，也許是：明知不可為而為之。</p><p>他三歲喪父，由母親獨力撫養，年少時貧困，做過管理倉庫、看管牲畜的小吏。但他從不放棄學習，博覽群書，精通禮、樂、射、御、書、數六藝。到了三十歲，他開始收徒授課，逐漸在魯國建立名聲。</p><p>五十一歲，他終於有機會從政，先後擔任中都宰、司空、大司寇，政績斐然。但魯國國君沉迷於齊國送來的美女歌舞，荒廢朝政，孔子心灰意冷，辭官而去。那一年，他五十五歲，開始了長達十四年的周遊列國。</p><blockquote>帶著一群學生，乘著一輛破車，從魯到衛，到陳，到蔡，到楚，遊走在戰亂頻仍的中原大地，四處碰壁，屢屢受挫。在陳蔡之間斷糧七天，學生們病倒，孔子仍然弦歌不輟。</blockquote><p>有一次，一個隱士說：天下滔滔，洪流洶湧，誰能改變？與其跟著那個逃避亂世的人跑，不如跟著我們，一起避世隱居算了。孔子聽到這話，嘆了口氣，說：鳥獸不可與同群，吾非斯人之徒與而誰與？天下有道，丘不與易也。</p><p>六十八歲，孔子返回魯國，不再從政，專心整理典籍，教導學生。七十三歲，他在魯國去世。一個人，在屢次失敗之後，仍然選擇繼續，不是因為他看到了成功的希望，而是因為他相信這件事本身是對的——知其不可而為之，也許是孔子留給我們最深的一課。</p>"}, {"day": 44, "title": "儒家如何成為中國主流思想？", "body": "<p>孔子死後，儒家並沒有立刻稱霸。在整個戰國時代，法家才是最受歡迎的學說。道理很簡單：諸侯們要的是富國強兵。儒家告訴他們要仁義，在戰場上，這聽起來像廢話。最後，用法家路線的秦國，果然統一了天下。但秦朝只撐了十五年。暴政激起反抗，二世而亡。</p><p>漢朝建立之後，漢武帝採納了儒家大師董仲舒的建議：「罷黜百家，獨尊儒術」。</p><blockquote>從此，儒家成為官方意識形態，讀儒家經典是進入仕途的唯一通道。一個讀書人，要做官，要出人頭地，就必須熟讀《論語》、《孟子》、《大學》、《中庸》。</blockquote><p>這是儒家的勝利，也是儒家的危機。當一套思想成為統治工具，它的命運就不再只由它自身的真理決定，還由掌權者怎麼詮釋它、怎麼使用它來決定。孔子說「仁者愛人」，但統治者用儒家來論證「君為臣綱，父為子綱，夫為妻綱」——三綱，要求絕對服從，這其實離孔子的原意已經很遠。</p><p>這個張力，在儒家兩千年的歷史裡從未消失：孔子的仁心，和被政治化的儒家制度，始終是兩回事。</p>"}, {"day": 45, "title": "禮教吃人：儒家被扭曲的一面", "body": "<p>1918年，魯迅在《新青年》雜誌發表了《狂人日記》。故事裡，一個被認為發了瘋的人，看著周圍人們每天掛在嘴邊的「仁義道德」，翻開歷史書，卻在字縫裡看見兩個字：吃人。</p><p>「禮教吃人」，成為五四運動的核心控訴之一。那一代的知識分子，對儒家積累了深沉的憤怒，這憤怒是有根據的。在兩千年的儒家統治下，「三從四德」把女性困在家庭和服從的框架裡；「三綱」要求臣對君、子對父、妻對夫的絕對服從，任何違背都被扣上不忠不孝不義的帽子。</p><blockquote>以孔子的名義，壓迫了多少人，沉默了多少聲音，扼殺了多少生命——這個賬，必須算清楚，不能因為孔子的偉大而一筆帶過。</blockquote><p>但我們需要做一個重要的區分：孔子的思想，和後世以孔子之名建立的制度，是不同的兩件事。孔子自己，從未說過女性低人一等。他周遊列國，正是因為他不滿意現實的秩序，希望改變它。</p><p>真正把儒家變成壓迫工具的，是漢代以後的官方儒學，是宋明理學「存天理，滅人欲」的苦行主義，是科舉制度把儒家經典變成唯一的晉身階梯之後，思想的窒息和硬化。</p><p>我們紀念孔子，不是為了維護那個制度，而是為了找回那顆被那個制度埋葬的仁心。</p>"}, {"day": 46, "title": "儒家的仁心，在歷代儒者中如何流傳？", "body": "<p>禮教確實吃人。但在那兩千年裡，孔子的仁心並沒有完全死去。它藏在一代又一代儒者的文章和生命裡，有時微弱，有時熾烈，從未完全熄滅。</p><p>北宋的范仲淹，多次被貶，仍然捐出大部分家產，在蘇州購置義田，讓族人和貧苦鄰里有田可耕，有地可葬。他寫下了中國政治文化裡最擲地有聲的一句話：先天下之憂而憂，後天下之樂而樂。</p><p>南宋的文天祥，明知宋朝大勢已去，仍然拒絕降元，在獄中寫下《正氣歌》。他說：人生自古誰無死，留取丹心照汗青。</p><blockquote>明代的王陽明，在被貶到貴州龍場的蠻荒之地，在絕境中悟出「知行合一」——真正的知，必然體現在行動上；真正的行，必然包含對道德的理解。知和行，不是兩件事。</blockquote><p>清末的譚嗣同，參與戊戌變法失敗，本可逃走，卻選擇留下，慷慨就義，說：各國變法，無不從流血而成，今日中國未聞有因變法而流血者，此國之所以不昌也。有之，請自嗣同始。</p><p>一個思想的生命力，不在於有多少人背誦它，而在於有多少人用它活著。儒家的仁心，在這些人身上，是活的。</p>"}, {"day": 47, "title": "孟子：人性本善，還是可以為善？", "body": "<p>孟子是孔子之後最重要的儒家思想家，生於公元前372年。他最著名的主張，是人性本善。</p><p>他用一個思想實驗來論證：如果你忽然看見一個嬰兒快要掉入井裡，你的第一個反應是什麼？每個人，無論好人壞人，那一刻都會有一種驚恐、想要出手阻止的衝動。孟子說：這就是惻隱之心，是仁的萌芽。每個人都有，這說明人性之中，善的根芽是天生的。</p><blockquote>但他也清醒地說：有這顆善的種子，不等於自然會長成善的大樹。種子需要澆水，需要陽光，需要耕耘。人需要教育，需要環境，需要自己的努力，才能讓那顆善的種子成長。</blockquote><p>他用「牛山之木」作比喻：牛山本來樹木茂盛，但因為反覆被砍伐，加上牛羊不斷啃食，最後變成光禿禿的山。人心也一樣：本來有善，但被惡劣的環境、錯誤的選擇、反覆的麻木消磨，最終那顆善心彷彿消失了。但它沒有死，只是被遮蓋了。</p><p>孟子還有一個重要的觀點：民貴君輕。人民最重要，國家次之，君主最輕。如果一個君主殘暴不仁，失去了行仁義的資格，人民有權推翻他。這個精神，和現代民主理論中「政府的正當性來自人民的同意」，有著深深的呼應。</p>"}, {"day": 48, "title": "荀子與韓非：另一條路", "body": "<p>儒家內部，有一個聲音，一直和孟子的「性善論」唱反調。荀子，公元前約316年生，卻得出了完全相反的結論：人性本惡。</p><p>荀子的論證很有力：人生來就有慾望。如果任由這些慾望自然發展，結果只有衝突和混亂。所以人需要「化性起偽」——透過後天的教化和禮義，把天生的惡性改造成善行。「偽」不是虛偽，是人為，是努力。</p><blockquote>荀子的邏輯，走到極端，會通向哪裡？如果人性本惡，禮義是外加的規範，那麼最有效的約束，不就是法律和刑罰嗎？</blockquote><p>荀子最著名的兩個學生，韓非和李斯，走的正是這條路。韓非是法家集大成者，他說：統治靠的是「法、術、勢」——明確的法律、馭臣的權術、君主的絕對權威。李斯後來成為秦始皇的丞相，幫助他統一天下，也幫助他焚書坑儒。</p><p>思想不是中性的。它的邏輯，有時比提出者更誠實——它會把你帶到你起初沒有預料到的地方。選擇怎樣理解人性，是一個有真實後果的哲學選擇，不只是書齋裡的玄想。</p>"}, {"day": 49, "title": "儒家思想今天還有什麼價值？", "body": "<p>這是孔子章節的最後一天。讓我把問題問得直接一點。在一個民主、科學、人工智能的時代，一個生於兩千五百年前的魯國老人，還有什麼話值得我們聽？</p><p>我的答案是：很多。但要分清楚哪些值得保留，哪些需要放下。</p><p>需要放下的：三綱五常裡對等級服從的絕對化要求；對女性的系統性壓制；「學而優則仕」衍生出的功利主義教育觀；以及一切把儒家變成維護既得利益者的意識形態的詮釋。</p><blockquote>值得保留的，我認為有三樣。第一，關係倫理。儒家從來不把人看作孤立的個體，而是看作關係中的存在。在一個越來越原子化、孤立的現代社會，「我對你負有責任，你對我也負有責任」這個倫理框架，比任何時候都更需要。</blockquote><p>第二，自我修養的倫理。儒家相信，一個更好的社會，從每一個人成為更好的自己開始。在一個習慣把責任推給制度、推給他人的時代，這個自我要求的精神，需要重新召回。</p><p>第三，那顆仁心。孔子說仁者愛人，說己所不欲勿施於人，說見人之苦如己之苦。這顆心，不需要任何哲學訓練，只需要你在下一個遇見人的時刻，多停留一秒，多問一句：你還好嗎？</p><p>下週，我們走向中東的曠野。一個年輕人，三十歲，突然出現在約旦河邊，開口說話，召集跟隨者，說自己是神的兒子。他的名字，叫耶穌。</p>"}]}, {"title": "第五章：耶穌與大愛", "articles": [{"day": 50, "title": "中點回顧：四聖哲有何共同之處？", "body": "<p>今天是第五十天。我們走到了整個旅程的中點。讓我們停下來，回頭看看走過的路。</p><p>過去四十九天，我們認識了三位聖哲。蘇格拉底在雅典廣場上追問什麼是公義，什麼是勇氣；佛陀在恆河邊的菩提樹下，洞見苦難的根源在於執著；孔子在顛沛流離的馬車上，堅持相信仁心可以重建社會秩序。三個人，三種語言，三個文明，三套完全不同的宇宙觀。但有五件事，他們是一樣的。</p><p>第一，他們都活在亂世。偉大的思想，往往不誕生於太平盛世，而誕生於裂縫之中。</p><blockquote>第二，他們都把目光轉向人的內心。不是問天上的神明，不是問自然的規律，而是問：一個人，如何在有限的生命裡，活得更有尊嚴，更有意義，更少苦難？</blockquote><p>第三，他們都不只是說，而且做。蘇格拉底用生命捍衛哲學；佛陀在覺悟後留在人間傳法四十五年；孔子周遊列國十四年，明知不可為而為之。他們的思想，和他們的生命，是同一件事。</p><p>第四，他們都對人有深沉的情感。不是居高臨下的憐憫，而是真正的在乎——在乎人受苦，在乎人迷失，在乎人可以更好。</p><p>第五，他們都相信每一個人都有向善的能力。這是一種根本的平等觀：在道德面前，沒有人天生被放棄。</p><p>明天，第四位聖哲登場。他比前三位更難說，因為圍繞他的爭議，兩千年來從未停止。但正因如此，他更值得我們認真去看。</p>"}, {"day": 51, "title": "耶穌出現的世界：猶太地的故事", "body": "<p>公元一世紀的猶太地，是一個充滿屈辱和張力的地方。羅馬帝國統治著這片土地，駐紮著軍隊，徵收著沉重的稅賦，扶植著傀儡政權。猶太人是被征服者，在自己的土地上是二等公民。</p><p>在這種屈辱之下，猶太社會分裂成幾個截然不同的派別：法利賽人嚴格遵守律法；撒都該人和羅馬統治者合作；奮銳黨人是武裝抵抗者；愛色尼人則逃離社會，在曠野中等待末日的審判。</p><blockquote>在這樣的世界裡，每個人都在等待一個彌賽亞——一個受膏的君王，一個拯救者，要來帶領猶太人脫離苦難，恢復大衛王朝的榮光。</blockquote><p>他們等待的，是一個政治領袖，一個軍事英雄。來的，是一個木匠的兒子，從加利利的拿撒勒來，帶著漁夫、稅吏和妓女，說的第一句話是：天國近了，你們應當悔改。</p><p>這不是任何人預期的彌賽亞的樣子。但正是這個落差，讓耶穌的故事如此震撼。他帶來的，不是政治解放，而是一種更根本的革命——不是改變統治者，而是改變人心；不是建立地上的王國，而是宣揚一個完全不同的價值秩序。在那個秩序裡，強者不再自動正確，弱者不再天生低賤，稅吏和妓女可以比法利賽人更接近上帝。</p>"}, {"day": 52, "title": "耶穌是誰？歷史與信仰的邊界", "body": "<p>在開始談耶穌的思想之前，我需要先說一件不舒服但必要的事。</p><p>耶穌，是歷史上最有影響力的人之一，同時也是最難客觀談論的人之一。因為對於兩千年來數以億計的基督徒而言，他不只是一個歷史人物，他是神的兒子，是救主，是復活的基督。這個信仰，是他們生命的核心。我尊重這個信仰。但在這個系列裡，我嘗試從一個稍微不同的角度來看耶穌——不是否定那個信仰，而是在信仰的括號之外，看看歷史和思想層面的耶穌是什麼樣子。</p><p>歷史上，耶穌的存在，有越來越多非基督教的史料佐證。羅馬史家塔西佗在《編年史》中提到，「基督」是「在提比略統治時期，被總督本丟·彼拉多處決的」。猶太史家約瑟夫斯也在著作中提到耶穌。歷史學界的主流共識，是耶穌作為一個真實存在的歷史人物，沒有合理的理由去懷疑。</p><blockquote>但他說的話是否全部被如實記錄，他的神蹟是否真實發生，他的復活是歷史事件還是信仰詮釋——這些問題，超出了歷史學的範疇，進入了信仰和神學的領域，沒有辦法用純粹的理性方法解決。</blockquote><p>我的立場是：你不需要相信耶穌是神的兒子，才能從他的思想中得到智慧。就像你不需要相信佛陀真的在菩提樹下見到天魔，才能從四聖諦中得到洞見。他說的話，他對人的態度，他在死亡面前的選擇——這些，無論你的信仰立場如何，都值得認真對待。</p>"}, {"day": 53, "title": "天國的比喻：耶穌怎樣說故事？", "body": "<p>耶穌有一種罕見的才能：他能把最深刻的真理，藏進最簡單的故事裡。</p><p>他說了一個故事：一個父親有兩個兒子，小兒子要求提前分得家產，跑去遠方揮霍，最終落魄回家。父親看見他從遠處走來，不等他說話，就跑上去擁抱他，為他擺設筵席。大兒子站在門外，憤憤不平。</p><blockquote>這個「浪子回頭」的比喻，短短幾百字，說盡了人的驕傲、墮落、悔悟、以及一種超越功過計算的愛。兩千年來，它被無數人在人生最黑暗的時刻讀到，感到自己被那個跑上來的父親擁抱。</blockquote><p>為什麼用比喻？耶穌的學生問過他這個問題。他的答案意味深長：真理不能只在頭腦裡理解，必須在心裡感受。一個道理，聽過就忘；一個故事，可以住在人心裡幾十年，在某個特定的時刻忽然亮起來。</p><p>現代神經科學告訴我們，人腦在處理敘事的時候，會啟動比處理邏輯論證更多的腦區，包括與情感、感官和記憶相關的部分。一個好故事，讓人身歷其境；一個好論證，讓人點頭稱是。但讓人改變的，往往是前者。</p><p>耶穌用漁夫、農夫、牧羊人、女人找硬幣——都是他那個時代最普通的人和最日常的場景——來說最不普通的事。這種把崇高藏進日常的能力，讓他的話語穿越了兩千年的時間，走進了任何一個文化。</p>"}, {"day": 54, "title": "道德金律：你希望人怎樣待你？", "body": "<p>在登山寶訓裡，耶穌說了一句話，後世稱之為「黃金律」：你們願意人怎樣待你們，你們也要怎樣待人。</p><p>我們在 Day 38 說過，孔子也說過幾乎相同的話：己所不欲，勿施於人。孔子說不要對別人做你不希望被做的事；耶穌說主動去對別人做你希望別人對你做的事。前者是底線，後者是召喚。</p><p>在地球的兩個不同角落，相距大約五百年，兩個從未謀面的人，幾乎同時說出了同一個道德原則的兩個版本。這說明這個原則觸碰到了某種普遍的人類道德直覺。</p><blockquote>哲學家康德後來用更嚴謹的語言重新表述：只按照你同時能夠意願它成為普遍法則的準則行動。意思相近：在做任何事之前，先問：如果每個人都這樣做，世界會變成什麼樣子？</blockquote><p>黃金律有一個深刻的前提：它要求你真正地、認真地，站到另一個人的位置上去感受。不是想像「如果我是他，我會怎樣」然後用自己的標準去衡量，而是真正去理解：他的需要是什麼？他希望被怎樣對待？</p><p>研究發現，同理心是可以練習的，但在一個快節奏、螢幕充斥的時代，它正在萎縮。黃金律最重要的功能，不是提供一條道德規則，而是要求一種日常的練習：在每一個與人相遇的時刻，慢下來，問那個問題：如果是我，我希望被怎樣對待？這一秒的停頓，可以改變很多事。</p>"}, {"day": 55, "title": "愛仇敵：這是可能的嗎？", "body": "<p>耶穌說過很多讓人難以接受的話，但也許最難接受的一句，是這個：愛你們的仇敵，為逼迫你們的人禱告。</p><p>這句話，兩千年來讓無數人感到不適，覺得不切實際，甚至覺得不公平。我憑什麼要愛傷害過我的人？</p><p>讓我們先弄清楚耶穌說的「愛」是什麼意思。希臘文裡，「愛」有幾個不同的詞：eros 是情愛，philos 是友愛，而耶穌說愛仇敵用的詞是 agape——一種不計回報的、不基於感情的、純粹出於意志的善意。</p><blockquote>他說的不是「喜歡你的仇敵」，不是「假裝傷害沒發生」，不是「讓對方繼續傷害你」。他說的是：在你的心裡，不讓仇恨佔據那個位置，因為仇恨最終傷害的是你自己。</blockquote><p>馬丁·路德·金在民權運動中實踐了這個原則。他說：仇恨讓靈魂生病。我們必須愛我們的白人兄弟，不論他們對我們做了什麼，因為這是唯一讓我們和他們都得到解放的方法。</p><p>曼德拉在羅本島坐了二十七年的牢。出獄之後，他沒有帶領南非走向仇恨和報復，而是建立了「真相與和解委員會」，選擇不以牙還牙。南非沒有內戰，這個選擇功不可沒。</p><p>「愛仇敵」也許永遠是一個太高的標準，大多數人在大多數時候做不到。但它的存在，作為一個方向，作為一個理想，有它的意義：它阻止你在仇恨裡越陷越深，阻止那個循環繼續。</p>"}, {"day": 56, "title": "耶穌之死：捨己的極致", "body": "<p>公元30或33年的逾越節前夕，耶穌和十二個門徒在耶路撒冷共進最後的晚餐。他知道自己快死了。不是模糊的預感，而是清醒的認知。他可以逃跑。耶路撒冷不是他的家，通往加利利的路他熟悉。他沒有。</p><p>晚餐之後，他去了客西馬尼園禱告。福音書記載，他在那裡汗如血滴，求父「讓這杯離我而去」——這個描述，讓我每次讀到都停下來。這不是一個超人，不是一個無所畏懼的神。這是一個人，在黑暗中，對即將來臨的死亡感到真實的恐懼，真實的掙扎。</p><blockquote>然後他說：不要照我的意思，只要照你的意思。這一句，也是人類面對不可避免之事時，最深的一種順服——不是麻木，不是絕望，而是在清醒的恐懼中，仍然選擇走下去。</blockquote><p>他被捕，受審，被鞭打，被迫背著十字架走向各各他山。在受盡屈辱、臨死之際，他說的是：父啊，赦免他們，因為他們不知道自己做的是什麼。</p><p>在生命最後一刻仍然求赦免，仍然指向他人而非自己的心，是人類歷史上最震撼的道德行動之一。他死了。他的門徒四散逃跑，躲在房間裡，以為一切都結束了。但事情，並沒有結束。</p>"}, {"day": 57, "title": "門徒怎樣把耶穌的道傳下去？", "body": "<p>耶穌死後的第一個星期日早晨，幾個女門徒走向埋葬他的墳墓，帶著香料，準備做最後的安葬。她們發現墓是空的。</p><p>這之後發生的事，是基督教信仰的核心，也是兩千年來爭議不斷的歷史謎題。但有一件事是確定的：耶穌死後，他的門徒從躲藏恐懼的一群人，變成了願意公開傳道、甚至以死殉道的人。這個轉變，需要一個解釋。他們的解釋，是復活。</p><blockquote>彼得，那個在耶穌被捕之夜三次否認認識他的人，後來站在耶路撒冷的人群面前，公開宣講耶穌的道，最終在羅馬被倒釘十字架而死——據說他要求頭朝下，因為不配和老師用同樣的方式死去。</blockquote><p>其他的門徒，幾乎全部死於殉道：安德烈在希臘被十字架處死，多馬在印度被長矛刺死，馬太在埃塞俄比亞被劍刺死。這些人，為了一個他們親眼見過他被殺死的老師，選擇把自己的生命也交出去。不是因為有人強迫，不是因為有政治利益，而是因為他們相信，他們親眼看見的那些事，是真實的，是值得用生命傳遞下去的。</p><p>他們傳遞的，是一個關於愛的消息：一個不基於你的功過，不基於你的出身，不基於你有沒有資格，而是白白給予的愛。這個消息，在一個充滿等級、羞辱和無力感的羅馬世界裡，對那些被遺棄的人，是一道光。</p>"}, {"day": 58, "title": "保羅：把基督教帶向世界的人", "body": "<p>有一個人，他從未見過活著的耶穌，卻對基督教的形成，影響之深，幾乎不亞於耶穌本人。他叫掃羅，後來改名保羅。</p><p>他原本是一個法利賽人，對基督徒深惡痛絕，積極參與逮捕和迫害他們。然後，在去大馬士革逮捕更多基督徒的路上，一道強光把他打倒在地，他聽到一個聲音：「掃羅，掃羅，你為什麼逼迫我？」他問：「你是誰？」聲音說：「我是你所逼迫的耶穌。」他瞎了三天，然後重見光明，改宗，成為基督徒中最熱情的傳道者。</p><blockquote>保羅是把基督教從一個猶太教的支派，轉化為一個向所有人開放的普世宗教的關鍵人物。他說出了基督教歷史上最具革命性的一句話：不分猶太人和希臘人，不分奴隸和自由人，不分男人和女人，你們在基督裡都是一樣的。</blockquote><p>在一個嚴格劃分民族、階級和性別的古代世界，這句話是炸彈。保羅在地中海世界各地建立教會，寫了大量書信，其中許多成為新約聖經的重要組成部分。他最終在羅馬被尼祿皇帝處死。</p><p>他一生中說過一句話，我一直覺得是對人文精神最美的一種表達：我若能說萬人的方言，並天使的話語，卻沒有愛，我就成了鳴的鑼、響的鈸一般。一切才能，一切知識，一切信仰，如果沒有愛，都是空的。這句話，兩千年後，依然沒有過時。</p>"}, {"day": 59, "title": "博愛與平等：耶穌的思想如何影響現代？", "body": "<p>1789年，法國大革命爆發，革命者喊出了一個口號：自由、平等、博愛。「博愛」（fraternité）這個詞，在政治語言裡是罕見的。自由和平等，可以從古希臘的公民理想中找到根源；但博愛——把所有人視為兄弟姐妹，把對陌生人的關懷納入政治原則——這個衝動，在西方文化裡，很大程度上來自基督教的土壤。</p><p>耶穌說了一個故事：好撒瑪利亞人。一個猶太人在路上被打劫，一個祭司路過，繞道而行；一個利未人路過，也繞道而行；最後，一個撒瑪利亞人路過——而撒瑪利亞人和猶太人之間，素有族群仇恨——他停下來，包紮傷口，帶他去旅館，自掏腰包付了費用。</p><blockquote>「鄰舍」不是地理概念，不是族群概念，而是一個行動概念：誰在需要的時候停下來，誰就是鄰舍。</blockquote><p>廢奴運動的核心人物，很多是虔誠的基督徒。他們援引的，正是保羅的「在神面前人人平等」和耶穌的「愛你的鄰舍」。約翰·牛頓，一個曾經的奴隸販子，改宗後寫下了《奇異恩典》，成為廢奴運動的精神象徵之一。</p><p>《世界人權宣言》第一條：人人生而自由，在尊嚴和權利上一律平等。這句話的哲學根源，有啟蒙理性的貢獻，也有基督教博愛傳統的血脈。當然，基督教也曾為奴隸制辯護，也曾發動十字軍。但那個「每一個人都有不可剝奪的尊嚴」的核心信念，是耶穌留給現代世界最深的遺產之一。</p>"}, {"day": 60, "title": "仁心、慈悲、大愛、愛智：原來是同一回事？", "body": "<p>今天，我們來到了四聖哲旅程的終點。</p><p>六十天了。我們走過了雅典的廣場，菩提樹下的森林，魯國顛沛的馬車，和猶太地的曠野。我們看見了四個人，在四個不同的角落，用四種不同的語言，回答同一個問題：人，應該怎樣活？</p><p>蘇格拉底說，愛智慧。不停地追問，不讓任何答案成為偶像，不讓自己的靈魂在舒適中沉睡。佛陀說，慈悲。看見苦難，不逃避，不麻木，讓自己的心真正被他人的痛苦觸動。孔子說，仁。在每一個具體的關係裡，在每一個遇見人的時刻，多一分在乎，少一分冷漠。耶穌說，愛。不計回報，不分對象，不問值不值得。</p><blockquote>四個詞：愛智、慈悲、仁、愛。四種語言，四種文化，四套宇宙觀。但當你把它們疊在一起，你會發現，它們指向的，是同一個方向：把目光從自己身上移開，轉向面前的這個人。真正看見他，真正在乎他，真正願意為他多走一步。</blockquote><p>這，就是人文精神的核心。不是一套哲學體系，不是一種宗教信仰，而是一種態度，一種選擇，一種在每一個平凡的日子裡都可以實踐的心。</p><p>那顆心，二千五百年來從未消失，只是在不同的人身上，以不同的方式發光。下週，我們離開聖哲的時代，走進歷史的黑暗——帝國、宗教壟斷、瘟疫和戰爭。那些光，在那個漫長的黑暗裡，幾乎熄滅，但沒有。</p>"}]}, {"title": "第六章：帝國與信仰的時代", "articles": [{"day": 61, "title": "為何聖哲的思想都會被權力扭曲？", "body": "<p>蘇格拉底、佛陀、孔子、耶穌，四個人，四套思想，方向各異，但有一件事高度一致：他們都對權力保持懷疑，都把關懷弱者放在核心，都挑戰那個時代的既得利益者。然而，沒有例外，他們死後，他們的思想都被權力收編，變成了鞏固統治的工具。</p><p>孔子說仁者愛人，漢代的統治者用儒家論證「君為臣綱」，叫臣民絕對服從。耶穌說愛你的仇敵，羅馬教會卻發動十字軍，以上帝之名屠殺穆斯林。佛陀說眾生平等，後世的統治者卻用佛教的業報論說服低種姓的人接受苦難。</p><blockquote>思想，一旦離開了它誕生的那顆心，就開始被各種人用各種方式詮釋。詮釋是必要的，但詮釋也是危險的——因為詮釋者往往帶著自己的利益和恐懼。</blockquote><p>為什麼會這樣？我認為有三個原因。第一，制度化的代價。思想要傳播，需要組織；組織需要資源；資源需要和權力結盟。這個結盟，從一開始就埋下了被收編的種子。第二，語言的可塑性。偉大的思想往往用開放的語言表達，這讓它既能被廣泛接受，也能被廣泛誤用。第三，人的惰性。跟隨一個思想，比理解一個思想容易；服從一個制度，比思考一個問題省力。</p><p>這是我們每一代人都要面對的挑戰：如何在繼承一個傳統的同時，不讓那個傳統把我們困住。回到源頭，自己思考，是唯一的出路。</p>"}, {"day": 62, "title": "基督教如何成為羅馬帝國的國教？", "body": "<p>公元64年，羅馬城發生了一場大火，尼祿皇帝把責任推給基督徒，發動了第一次大規模迫害。彼得和保羅，都在這個時期殉道。在接下來的兩百五十年裡，基督徒在羅馬帝國是非法的存在，定期遭到迫害。</p><p>然後，在公元312年，羅馬將軍君士坦丁在米爾維安橋戰役前夕，據說看見了天空中出現一個十字架，旁邊有字：「憑此得勝。」他以十字架記號作為軍旗，打贏了那場仗，成為羅馬帝國的統治者。</p><blockquote>第二年，他頒布了《米蘭敕令》，宣布宗教寬容，基督教從被迫害的地下宗教，一夜之間獲得了合法地位。八十年後，公元380年，狄奧多西皇帝把基督教立為羅馬帝國的唯一國教。</blockquote><p>這個轉變，對基督教意味著什麼？表面上是勝利。但很多歷史學家和神學家認為，這也是基督教最深的危機之一。當一個宗教從被迫害者變成統治者，它就必須回答一個它原本不需要回答的問題：我應該如何使用權力？</p><p>耶穌說：我的國不屬這世界。他的門徒在帝國的邊緣傳道，靠的是言語和榜樣，沒有軍隊，沒有稅收，沒有法庭。但當基督教成為國教，它就有了這些。一個宗教，在獲得權力的那一刻，就開始了它最大的道德考驗。這個考驗，從未有任何宗教完美通過。</p>"}, {"day": 63, "title": "伊斯蘭教：穆罕默德的創新在哪裡？", "body": "<p>公元570年，在阿拉伯半島的麥加，一個叫穆罕默德的孩子出生，很快就失去了父親，六歲時又失去了母親。麥加是一個商業城市，也是一個宗教中心，社會的財富極度不均，奴隸制度普遍，孤兒和女性的處境尤為悲慘。</p><p>公元610年，四十歲的穆罕默德，據說在麥加郊外的希拉山洞裡，感受到了天使加百列的降臨，帶來了第一段《古蘭經》的啟示。他最初的反應，不是喜悅，而是恐懼和疑惑——他以為自己瘋了，跑回家讓妻子安慰。海蒂徹成為第一個相信他的人，也成為伊斯蘭教的第一個穆斯林。</p><blockquote>穆罕默德帶來的宗教，在神學上有意識地繼承並修正了猶太教和基督教。同一個神，亞伯拉罕的神，但他說：那些宗教的啟示被人篡改和扭曲了，《古蘭經》是最後的、最完整的啟示。</blockquote><p>他的創新，首先在於平等。穆罕默德宣告：所有穆斯林在真主面前一律平等，無論阿拉伯人或非阿拉伯人，無論貴族或奴隸。其次，在於實踐性。伊斯蘭教的五功——念、禮、齋、課、朝——把信仰完整地融入日常生活的每一個角落。</p><p>伊斯蘭教在一百年內傳遍了從西班牙到中亞的廣大土地，速度之快，令歷史學家至今驚嘆。它的成功，不只靠劍，也靠它提供的秩序感、平等感，以及那種讓信仰和生活完全融合的整體性。</p>"}, {"day": 64, "title": "宗教壟斷思想，社會會怎樣？", "body": "<p>想像一個社會，有一套思想體系，宣稱掌握了所有問題的終極答案。這套體系有一個機構來詮釋和守護它，任何質疑都被視為危險，任何偏離都受到懲罰。這樣的社會，會發生什麼？</p><p>中世紀的歐洲，天主教會幾乎壟斷了思想的解釋權長達一千年。伽利略說地球繞太陽轉，被宗教裁判所審判，被迫公開放棄自己的發現，在軟禁中度過餘生。科學的發展，在這樣的環境裡，被壓制和遲滯了幾個世紀。</p><blockquote>任何聲稱擁有全部真理的體系，都有走向不寬容的內在邏輯：如果我知道唯一的真理，那麼質疑我就是危險的；如果我知道什麼對你最好，那麼強迫你接受就是仁慈的。</blockquote><p>這個邏輯，不只出現在宗教裡。二十世紀的極權主義——無論是法西斯主義還是斯大林主義——也建立在同樣的結構上：一套宣稱掌握歷史真理的意識形態，一個詮釋和執行它的黨，以及對任何偏離的系統性懲罰。</p><p>但這不是說信仰本身是危險的，或者宗教必然導向壓迫。問題不在信仰，在壟斷。一個健康的思想生態，需要多元，需要容許批評，需要「我可能是錯的」這個空間永遠存在。蘇格拉底早在兩千五百年前就說過：未經檢驗的信念，不值得持有。</p>"}, {"day": 65, "title": "智慧宮：伊斯蘭文明如何保存古希臘智慧？", "body": "<p>公元830年左右，在巴格達，阿拔斯王朝的哈里發馬蒙建立了一個叫「智慧宮」（Bayt al-Hikmah）的機構。它是圖書館，是翻譯局，是學術中心，也是當時世界上最重要的知識聚集地。來自波斯、印度、希臘、敘利亞的學者，把各種語言的典籍翻譯成阿拉伯文。亞里士多德的邏輯學、柏拉圖的哲學、歐幾里德的幾何學、托勒密的天文學——這些在歐洲逐漸失傳的古典著作，在這裡被保存、研究和發展。</p><blockquote>不只是保存，伊斯蘭學者還發展和創新。阿爾-花拉子米發展出代數學，「algebra」這個詞，就來自他的著作書名《al-Jabr》。伊本-西拿（阿維森納）的醫學百科，成為歐洲醫學院的標準教材，沿用了五六百年。</blockquote><p>十二至十三世紀，隨著十字軍東征、基督教和伊斯蘭世界的接觸，大量阿拉伯文著作被翻譯成拉丁文，流入歐洲。那些古希臘的思想，兜了一個大圈——從希臘，到拜占庭，到阿拉伯，再回到歐洲——終於點燃了文藝復興的火花。</p><p>這個故事還告訴我們另一件事：在歷史上，伊斯蘭文明曾經是世界上最開放、最有求知精神的文明之一。任何把伊斯蘭和「反智」、「封閉」簡單掛鉤的說法，都是對歷史的無知。每一個傳統，都有它的黃金時代，也有它的黑暗時代。評判一個文明，要看它的全貌，不是它的某一個切面。</p>"}, {"day": 66, "title": "中世紀歐洲：黑暗還是有光？", "body": "<p>「中世紀」這個詞，在今天幾乎是「落後」的同義詞。但這個印象，只有一半是真的。</p><p>黑暗的部分，是真實的。公元五世紀羅馬帝國的崩潰，帶來了幾個世紀的混亂：人口銳減，城市荒廢，貿易萎縮，識字率大幅下降。黑死病在1347至1351年間席捲歐洲，奪去了大約三分之一的人口。戰爭幾乎從未停止，農奴制度讓大多數人的生活毫無自由可言。宗教裁判所以異端罪名拷問和處決了無數人。</p><blockquote>修道院，在這個時代，扮演了一個難以估量的角色。那些隱居的修士，在抄寫聖經的同時，也抄寫了大量古羅馬和古希臘的著作，讓那些文字在蠻族入侵的混亂中存活下來。沒有這些修道院，西方古典文明的遺產可能真的消失了。</blockquote><p>哥德式大教堂，是中世紀另一個被低估的遺產。那些拔地而起的石塔，那些讓陽光透過彩色玻璃灑落的玫瑰窗，是那個時代的人用一生的勞動奉獻給他們信仰的東西，有些大教堂的建造跨越了幾個世紀。</p><p>十二、十三世紀，歐洲開始出現大學——博洛尼亞、巴黎、牛津——那是知識重新組織自己的地方，也是後來科學革命的溫床。歷史從來不是非黑即白。在那個被稱為黑暗的時代裡，有人在悄悄地抄書。光，從來沒有真正熄滅。</p>"}, {"day": 67, "title": "帝國與信仰時代的普通人過得怎樣？", "body": "<p>我們談了帝國，談了教會，談了哲學家和神學家。但有一個問題，我一直想問：在那漫長的一千年裡，普通人，過得怎麼樣？</p><p>讓我們試著走進一個十三世紀法國農村的早晨。農夫已經起身。他是農奴，耕種的土地不屬於他，他每年要把大約三分之一的收成交給領主，再交一部分給教會作什一稅。他的平均預期壽命，大約三十五歲。他的孩子，大約有一半活不到五歲。</p><blockquote>但他並不是一個純粹受苦的人。他有他的社群，他的節慶，他的笑話，他的愛情，他的信仰。那套宇宙觀，讓苦難有了意義，讓死亡有了出路，讓每一天的勞苦都嵌入了一個更大的故事裡。你可以說那是愚昧，但你也必須承認，那給了他在現代世界許多人都缺乏的東西：一種確定感，一種歸屬感，一種知道自己在宇宙秩序中的位置的安心。</blockquote><p>這讓我想到一個至今仍然有意義的問題：當我們批評宗教的時候，我們有沒有認真想過，它在填補什麼空缺？那個空缺，在我們自己的生命裡，有沒有被別的東西填補？</p><p>那個中世紀的農夫，如果活在今天，他的生活會好很多——更長壽，更自由，更不受剝削。但他也失去了一樣東西：那種清晰的、把自己連接到某個更大意義的感覺。他失去的那樣東西，正是我們這個系列一直在追尋的。</p>"}, {"day": 68, "title": "成住壞空：歷史是進步還是循環？", "body": "<p>讀歷史久了，你會發現一個讓人既沮喪又釋懷的規律。每一個看起來堅不可摧的帝國，最終都會崩潰。羅馬帝國撐了幾個世紀，然後裂解。阿拔斯王朝的巴格達，1258年被蒙古軍隊夷為平地，智慧宮的書籍被丟進底格里斯河，據說河水都染成了黑色。拜占庭帝國，1453年，終於被奧斯曼土耳其攻破。</p><p>那麼，歷史是進步的，還是循環的？</p><blockquote>我的答案是：兩者都是，但不在同一個層次上。在物質和制度的層面，歷史有螺旋形的進步——每一次文明的崩潰，都不是回到原點，而是在廢墟上建起一些新的東西，帶著前一個文明的遺產繼續走。但在人性的層面，歷史是循環的：同樣的貪婪、同樣的恐懼、同樣的傲慢，在每一個時代重複出現。</blockquote><p>這個洞見，讓兩件事同時成立。第一，我們不應該對「進步」過於自滿。今天的文明，和羅馬帝國一樣，有它的盲點，有它終將被歷史批判的地方。謙遜，是讀歷史應該學到的第一件事。</p><p>第二，我們也不應該絕望。每一次黑暗之後，都有人重新點亮燈火。那些在修道院裡抄書的修士，那些在智慧宮裡翻譯典籍的學者，那些在廢墟裡重建學校的教師——他們沒有等待黑暗自己消散，他們在黑暗裡工作。你現在站在這條曲線的哪個位置，不是最重要的問題。最重要的問題是：你在這個位置，選擇做一個什麼樣的人？</p>"}, {"day": 69, "title": "人文精神如何在黑暗時代中存活？", "body": "<p>有一個問題，我認為是整個系列最核心的問題之一：在那漫長的「帝國與信仰」的時代，四聖哲的精神，去了哪裡？它沒有消失。它藏起來了。</p><p>它藏在修道院的抄書室裡，藏在一個個修士顫抖的手腕裡，那些手腕把古典著作一頁一頁地保存下來，不是因為教會命令他們這樣做，而是因為某種對知識本身的愛，讓他們在冬天的寒冷裡，繼續蘸墨，繼續寫。</p><p>它藏在蘇菲派神秘主義者的詩歌裡。魯米，十三世紀的波斯詩人，在伊斯蘭的框架裡，寫出了對神的愛、對人的愛、對萬物的連結，那種深度和美麗，超越了任何宗教的邊界。</p><blockquote>它藏在每一個選擇在高壓下保持善良的普通人身上。在鼠疫蔓延的城市裡，選擇留下來照顧病人的醫生和修女；在宗教戰爭的殺戮中，選擇收留對方難民的村民——這些人沒有留下名字，但他們是人文精神最真實的載體。</blockquote><p>它也藏在語言裡。但丁在1300年前後寫《神曲》，第一次用義大利方言而非拉丁文寫作，讓普通人也能讀到。這個選擇，是一個政治和人文的宣言：知識不只屬於精英，每一個人都值得接觸它。</p><p>人文精神的韌性，讓我想起竹子。在颱風裡，竹子彎下去，彎到幾乎觸地，但根沒有斷。風過去，它又直起來。黑暗時代，人文精神的根，沒有斷。它只是在等待春天。</p>"}, {"day": 70, "title": "是什麼觸發了現代的開始？", "body": "<p>1347年的秋天，一隊從黑海來的熱那亞商船停靠在西西里島的墨西拿港。船員們大多已死去，倖存者身上長著奇怪的黑色腫瘤。鼠疫上岸了。黑死病在接下來的五年裡，橫掃整個歐洲，奪走了大約兩千五百萬條人命，大約是當時歐洲人口的三分之一。</p><p>這場災難，從反面加速了現代的到來。為什麼？因為鼠疫動搖了教會的權威。神職人員和平信徒同樣死去，禱告沒有阻止瘟疫，赦罪的儀式沒有讓病人痊癒。那個幾百年來告訴人們「只要服從，天主會保護你」的體制，在黑死病面前，顯得無能為力。</p><blockquote>倖存者從廢墟裡爬出來，開始用一種新的眼光看世界。既然死亡如此隨機，既然連教會都無法保護你，那麼，此生的意義是什麼？人，活著，為了什麼？</blockquote><p>這些問題，催生了文藝復興的衝動：把目光從天上收回，重新看見此生，重新看見人，重新看見人的身體、人的情感、人的創造力。</p><p>與此同時，拜占庭帝國在1453年被奧斯曼土耳其攻破，大批拜占庭學者帶著古典手稿逃往義大利，把那些幾乎被遺忘的希臘著作帶回了歐洲。古登堡在1450年左右發明了活字印刷術，讓思想可以以前所未有的速度傳播。幾個因素，在同一個時代，像幾條河流匯入同一個入海口。現代，就這樣開始了。</p>"}]}, {"title": "第七章：文藝復興與科學革命", "articles": [{"day": 71, "title": "黑死病之後，歐洲發生了什麼？", "body": "<p>倖存者從廢墟裡站起來，世界變了。黑死病殺死了三分之一的歐洲人，也意外地改變了倖存者的處境。勞動力驟然短缺，農奴開始有了議價能力。封建制度的根基，在這場瘟疫之後，開始鬆動。</p><p>但更深的改變，在人心裡。當你見過那麼多人死去，當你看見主教和乞丐在同一條街上倒下，當禱告和儀式都無法阻止死亡，你會開始問以前不敢問的問題：如果上帝允許這一切發生，我應該如何活這一生？</p><blockquote>瘟疫之後的歐洲，瀰漫著一種奇特的氣氛：一方面是對死亡的癡迷，另一方面是對生命的貪婪——既然隨時會死，就更要活得充分，活得真實，活得美麗。</blockquote><p>這種氣氛，在義大利的城市裡，率先轉化成了文化的爆發。佛羅倫薩、威尼斯、米蘭，這些商業城邦積累了巨大的財富，美第奇家族等商人貴族開始把錢花在贊助藝術家和學者上——不只是為了宗教，也是為了美，為了對人類潛能的純粹喜悅。</p><p>彼得拉克，十四世紀的義大利詩人，被很多人稱為「文藝復興的先驅」。他做了一件看起來很小的事，卻意義深遠：他開始收集古羅馬的手稿，不是為了神學研究，而是因為它們本身的美麗和智慧讓他著迷。把「偉大的人」和「基督徒」分開——這個細微的轉移，就是文藝復興的第一顆種子。</p>"}, {"day": 72, "title": "文藝復興：為何焦點重回「人」？", "body": "<p>「文藝復興」，英文是 Renaissance，法文，意思是「再生」。但再生的，不只是古典藝術和文學。再生的，是一種對人的信念——相信人有理性，有創造力，有尊嚴，有能力理解和改變自己所在的世界。這種信念，有一個名字：人文主義（Humanism）。</p><p>中世紀的世界觀，是神中心的：一切都以神為出發點，藝術的目的在於榮耀神，知識的終點是神學。文藝復興的世界觀，是人中心的：不是否定神，而是把人本身也視為值得關注和研究的存在。</p><blockquote>文藝復興的畫，人物突然有了立體感，有了陰影，有了具體的面孔和表情。那些聖母瑪利亞，開始看起來像一個真實的母親，懷抱著一個真實的嬰兒，眼睛裡有真實的愛和憂慮。「神聖」，第一次和「人性」融合在一起，而不是對立。</blockquote><p>文藝復興的藝術家，開始解剖屍體研究人體結構，不是出於醜陋的好奇，而是出於對人體之美和精密的驚嘆。達文西留下了數千幅人體解剖手稿，那些線條裡，有一種對上帝造物的深深敬畏，也有一種對人類理解力可以走多遠的好奇。</p><p>人文主義不是反宗教，它是一種補充：在神面前，人也值得被嚴肅對待。這個信念，走到今天，成為現代世界很多我們視為理所當然的東西的根基：人有天賦尊嚴，人有理性，人的判斷值得被尊重。</p>"}, {"day": 73, "title": "但丁、達文西、米開朗基羅：他們有何共同精神？", "body": "<p>但丁·阿利吉耶里，1265年生於佛羅倫薩，他做了一件改變歐洲的事：用義大利方言寫作。在他之前，嚴肅的文學和學術只用拉丁文。但丁說：不。我要用我母親教我的語言，用街頭的人都能讀懂的文字，寫宇宙間最宏大的故事。他寫了《神曲》，帶讀者走過地獄、煉獄、天堂。在地獄裡，他遇見了蘇格拉底和亞里士多德——他承認異教哲學家的道德高度，即使按照教義他無法把他們送進天堂。</p><blockquote>達文西，生於1452年，是文藝復興人文精神最完整的化身。他不只是畫家，他是解剖學家、工程師、建築師、音樂家、數學家、地質學家、植物學家。他的筆記本裡，有飛行機器的設計圖，有太陽系的素描，有人體肌肉的細節，和一首未完成的詩。</blockquote><p>達文西相信，藝術和科學不是對立的，而是同一種好奇心的兩個出口：對世界如何運作、如何呈現的深刻著迷。他留下的最重要的遺產，不是《蒙娜麗莎》，而是那種「什麼都值得好好研究」的精神。</p><p>米開朗基羅，生於1475年，在西斯廷教堂的天花板上畫了四年，幾乎弄瞎了自己的眼睛。那幅《創世記》，神和亞當的手幾乎相觸，中間只有一道氣隙——那道氣隙，被很多藝術史學家解讀為人類意識的誕生。神的手是主動的，亞當的手是被動的，但那個相觸的渴望，是雙向的。</p><p>三個人，跨越了大約兩個世紀，但他們身上有同一種精神：相信人的創造力可以觸碰神聖，相信美本身是一種真理，相信一個人全力燃燒自己，可以照亮幾百年的黑暗。</p>"}, {"day": 74, "title": "印刷術：人類歷史上第一次資訊革命", "body": "<p>1455年，古登堡在德國美因茨印出了他的第一批聖經，用他剛剛發明的活字印刷機。在此之前，一本書需要一個修士花幾個月甚至幾年手抄，一部聖經的成本，相當於一個農夫幾年的收入。</p><p>印刷機改變了這一切，速度之快，影響之深，讓我們今天想起來仍然感到震撼。古登堡的機器，一天可以印出一個抄書修士三個月的工作量。書的價格在一百年內跌去了大約八成。</p><blockquote>知識的民主化，從印刷機開始。當一個木匠可以花一週的工資買一本書，當一個城市的商人可以自己讀《聖經》而不依賴神父的詮釋，整個社會的認識論就改變了：誰有資格解釋真理，不再由出身和地位決定，而由你讀過什麼，思考過什麼決定。</blockquote><p>馬丁·路德，沒有印刷機，可能只是一個在威騰堡的小教堂裡對著幾十個學生抱怨的神學教授。但他把九十五條論綱寫下來，印刷機把它傳遍了整個德意志，兩週之內。宗教改革，在某種意義上，是印刷術的孩子。</p><p>今天，我們站在另一場資訊革命的中央。網際網路做到了印刷機做過的事，而且快了一億倍。問題也是一樣的：當所有人都能發言，當知識的門檻消失，誰來判斷真假？當資訊過剩，誰來教我們思考？印刷術沒有自動帶來啟蒙，它也帶來了謊言、煽動和宗教戰爭。資訊的流通，是條件，不是答案。思考的能力，才是答案。</p>"}, {"day": 75, "title": "哥白尼與伽利略：科學怎樣挑戰信仰？", "body": "<p>1543年，波蘭神父尼古拉·哥白尼在臨死前，出版了一本書：《天體運行論》。他在書裡說：地球不是宇宙的中心。太陽才是中心，地球和其他行星，繞著太陽轉。</p><p>這句話，在1543年，是一枚炸彈。一千多年來，歐洲人相信地球是宇宙的中心，這不只是天文學的觀點，而是整套神學和世界觀的基礎。哥白尼知道這個衝擊，所以他等到臨死才出版。伽利略，沒有他幸運。</p><blockquote>伽利略用望遠鏡看見了月球的山脈和隕石坑，看見了木星的四顆衛星，看見了金星的相位變化。羅馬教廷召喚他，審訊他，要求他放棄日心說。1633年，七十歲的他，在審判廳裡公開宣誓放棄。他被判處軟禁，在自己家裡度過了生命最後的九年，雙目失明。</blockquote><p>傳說他在宣誓之後，在心裡低聲說了一句話：但它（地球）確實在動。這句話可能是後人附會，但它承載了一個真實的精神：一個人可以被迫說謊，卻沒有辦法讓真相消失。</p><p>真正的衝突，不是科學對宗教，而是求真的精神對壟斷詮釋權的體制——無論那個體制是宗教的、政治的，還是學術的。哥白尼本人是神父，他的天文學研究是為了更準確地計算復活節的日期。伽利略終生是天主教徒，他不認為科學和信仰必然衝突。這個衝突，在今天仍然存在，只是穿著不同的外衣。</p>"}, {"day": 76, "title": "牛頓：自然世界原來有規律可循", "body": "<p>1666年，英格蘭正在流行鼠疫，劍橋大學關閉，二十三歲的艾薩克·牛頓回到鄉下的家，在接下來的十八個月裡，幾乎獨自一人，完成了人類科學史上最非凡的一段思想旅程。他發展出微積分，研究了光的色散，分析了行星的運動，最終提出了萬有引力定律：地球和月亮之間，蘋果和地球之間，太陽和所有行星之間，都由同一條公式連結。</p><blockquote>1687年，他出版了《自然哲學的數學原理》，用數學語言描述了宇宙的運行規律。這本書說：宇宙不是神秘莫測的，它是有規律的，那個規律可以用數學語言精確描述，任何人都可以學習和驗證。</blockquote><p>這個宣言的衝擊，遠超出科學的範疇。如果物理世界有可理解的規律，那麼人類社會呢？政治、道德、經濟，是否也有類似的規律，可以用理性去發現和應用？啟蒙時代的思想家，從牛頓那裡得到了巨大的靈感和信心。</p><p>但牛頓本人，其實並不認為科學排斥信仰。他花在神學研究上的時間，不亞於科學研究。他說：引力解釋了行星的運動，但它無法解釋是誰令行星開始運動。偉大的科學家，往往比那些搶著用科學「否定神」的人，更謙遜地面對那個終極問題。</p>"}, {"day": 77, "title": "啟蒙時代：盧梭、洛克在想什麼？", "body": "<p>如果文藝復興是人類重新發現自己，科學革命是人類重新理解宇宙，那麼啟蒙時代，就是人類把這兩種發現應用到社會和政治上：如果理性可以理解自然規律，為什麼不能用同樣的理性，重新設計人類的政治秩序？</p><p>約翰·洛克，1632年生，提出了後來成為現代民主基石的幾個概念。他說，政府的正當性，來自被統治者的同意。人有天賦的自然權利：生命、自由和財產。政府的唯一目的，是保護這些權利。如果政府違反了這個目的，人民有權反抗，甚至推翻它。</p><blockquote>盧梭，1712年生，走得更遠，也更矛盾。他說：人生而自由，卻無往不在枷鎖之中。文明不是進步，它讓人腐化，讓不平等制度化，讓人失去了原始的純真和善良。他呼喚一種「社會契約」：人民共同決定自己的命運，主權在民，不在君主，不在教會。</blockquote><p>亞當·斯密，1723年生，把同樣的理性主義應用到經濟上。他說，市場有一隻「看不見的手」，個人追求自身利益的行為，在競爭市場的機制下，會自動導向社會整體的利益。康德提出「敢於知道」（Sapere aude）作為啟蒙的口號——鼓勵人們用自己的理性，而不是依賴他人的權威。</p><p>這些人，無論觀點多麼不同，都在說同一件事：你有理性，用它。不要因為「這樣一直都是這樣」就接受它，不要因為「有權威的人這樣說」就相信它。蘇格拉底，在兩千年後的歐洲，以一種新的語言復活了。</p>"}, {"day": 78, "title": "人有天賦人權：這句話如何改變世界？", "body": "<p>1776年7月4日，費城。五十六個人在一份文件上簽名，對世界上最強大的帝國宣告獨立。那份文件的第二段，有一句話，在人類歷史上前所未有：</p><p>「我們認為這些真理是不言而喻的：人人生而平等，造物主賦予他們若干不可讓渡的權利，其中包括生命、自由和追求幸福的權利。」</p><blockquote>「不言而喻的真理」——這個措辭本身就是一個哲學宣言。它說，這些權利不是君主賜予的，不是教會認可的，不是法律創造的，它們是人作為人，與生俱來就有的。任何政治體制，若不承認這些權利，都失去了正當性。</blockquote><p>但我們必須誠實。那份美國獨立宣言的起草人傑佛遜，自己擁有超過六百個奴隸。「人人生而平等」——他說這句話的時候，心裡是否包括了他農場裡的那些人？歷史的答案是：沒有。</p><p>這個矛盾，不是要讓我們否定那句話的力量，而是要讓我們看清楚：偉大的原則，常常在宣告者自己的生命裡就已經被違背了。原則的價值，不在於第一個說出它的人，而在於那個原則本身，以及後來的人如何把它活出來、擴展它、要求它被兌現。</p><p>廢奴運動，女性參政運動，民權運動——它們的邏輯起點，都是同一句話：人人生而平等。一個被宣告但尚未實現的原則，成為了歷史上最強大的道德武器。</p>"}, {"day": 79, "title": "工業革命：物質豐盛了，人幸福了嗎？", "body": "<p>1769年，詹姆斯·瓦特改良了蒸汽機，讓它變得實用而高效。這個改良，點燃了工業革命。接下來的一百年，世界改變的速度，超過了此前一千年的總和。工廠取代了作坊，機器取代了雙手，鐵路連通了原本相隔遙遠的城市。人類第一次擁有了超越自然限制的大規模生產能力，物質財富以前所未有的速度積累。</p><p>但工業革命早期的工廠工人，每天工作十二至十六小時，在噪音、粉塵和危險中勞作，工資只夠勉強維生。兒童在礦井和工廠裡工作是常態。城市的快速擴張帶來了擁擠、污染、疾病。</p><blockquote>馬克思，坐在大英博物館的閱覽室裡，看著這一切，寫下了他對資本主義的控訴：工人被異化了。他們用雙手製造的產品，不屬於他們，他們在流水線上重複同一個動作，和自己的勞動失去了連結，和自己的創造力失去了連結，最終和自己失去了連結。</blockquote><p>這個批評，即使你不接受馬克思的政治方案，在心理層面是有洞見的。現代工作組織方式，讓很多人每天花八小時做一件對自己意義不明的事，換取一份工資，再用那份工資消費。這個循環，能帶來滿足，卻不一定帶來意義。</p><p>工業革命解決了貧窮問題，但它沒有解決意義問題。物質的豐盛，創造了一種新的空虛：你擁有的夠多了，但你為什麼而活，你仍然不知道。這個問題，是下週我們要面對的。</p>"}, {"day": 80, "title": "現代的代價：我們失去了什麼？", "body": "<p>讓我說一個數字。根據世界衛生組織2023年的數據，全球有超過兩億八千萬人患有抑鬱症，約佔世界人口的3.8%。在高收入國家，這個比例更高。這是在人類歷史上物質條件最好的時代裡發生的事。</p><p>我們建造了現代社會，我們得到了科學、民主、人權、抗生素、互聯網。但我們也失去了一些東西。</p><p>我們失去了共同的故事。中世紀的農夫，無論他的生活多麼艱苦，他知道自己在宇宙裡的位置。現代人失去了那個宏大的敘事，卻沒有找到足夠有力的替代品。</p><blockquote>我們失去了慢。工業革命帶來了時鐘的暴政——從此，時間不再是自然的流動，而是被切割成工時和閒暇，被計算成金錢和效率。一個永遠在加速的文明，讓人沒有時間停下來，問那個最根本的問題：我在往哪裡走？</blockquote><p>我們失去了共同體。前現代社會的人，活在家族、村莊、行會、教區的網絡裡，那些網絡有時是壓迫性的，但也是支撐性的。現代的個人，從那些網絡裡解放出來，得到了自由，也得到了孤獨。研究顯示，孤獨對健康的傷害，相當於每天抽十五根煙。</p><p>我們失去了靜默。手機填滿了每一個空隙，耳機隔絕了周圍的聲音，通知讓注意力永遠被打斷。在這樣的環境裡，深思很難，冥想很難，那種讓人真正認識自己的安靜，變成了需要刻意爭取的奢侈。</p><p>這不是要我們回到過去。但正視現代的代價，是我們誠實地活在這個時代的前提。知道失去了什麼，才能知道要找回什麼。下週，我們走進意義的危機。上帝死了，然後怎樣？</p>"}]}, {"title": "第八章：上帝已死與意義危機", "articles": [{"day": 81, "title": "尼采說「上帝已死」，他的意思是什麼？", "body": "<p>1882年，弗里德里希·尼采在《快樂的科學》裡，寫了一段令人震撼的文字。一個瘋子在大白天舉著燈籠跑進市場，高喊：「我找上帝！我找上帝！」周圍的人嘲笑他。瘋子停下來，直視著他們，說：「上帝死了。是我們殺死了他。我們怎樣安慰自己，這最殘忍的凶手？……」說完，瘋子把燈籠摔在地上，燈滅了。</p><blockquote>尼采說的「上帝已死」，不是一個無神論的歡呼，而是一個警告，甚至是一聲哀號。他不是說「太好了，神消失了，我們自由了」，他說的是：我們殺死了那個給世界提供意義和秩序的根基，但我們還沒有準備好承擔這個後果。</blockquote><p>這個後果是什麼？中世紀的人，有一套完整的意義體系：善惡有定義，歷史有目的，苦難有解釋，死亡有出路。這一切，以神為基礎。當科學和理性逐漸侵蝕那個基礎，那個意義體系就開始坍塌。但坍塌之後，留下的是什麼？一片空地。</p><p>尼采的問題，比他的很多讀者意識到的更深：不是「神存不存在」的形而上問題，而是「沒有神，我們憑什麼說一件事是善的、一件事是惡的？我們的道德從哪裡來？我們的意義從哪裡來？」上帝死了——或者，對很多現代人來說，上帝退場了。然後怎樣？</p>"}, {"day": 82, "title": "科學解釋了世界，但解釋不了意義", "body": "<p>有一個問題，科學永遠無法回答：這一切，有什麼意義？</p><p>科學可以告訴你，宇宙在138億年前由一場大爆炸開始，地球在46億年前形成，生命在大約38億年前出現，智人在大約30萬年前誕生。科學可以告訴你，你的身體由大約37兆個細胞組成，你的大腦有860億個神經元，你的意識是神經元之間電化學信號的複雜模式。這些都是真實的，令人驚嘆的知識。但它們回答不了你明天早上醒來可能會問的那個問題：我為什麼要起床？</p><blockquote>哲學家大衛·休謨在十八世紀已經指出一個根本的邏輯問題，後人稱之為「是-應當鴻溝」：從「事物是什麼樣子」，無法推導出「事物應當是什麼樣子」。科學描述現實，但它無法告訴我們應該如何生活，什麼值得追求，什麼是善，什麼是美。</blockquote><p>這不是科學的缺陷，而是科學的邊界。科學是人類探索事實世界最強大的工具，但意義不住在事實世界裡，它住在詮釋的世界裡，住在故事和選擇之中。</p><p>在這樣的圖景裡，意義從哪裡來？這不是否定科學，而是承認科學的局限，承認人需要的不只是知識，還需要一個讓那些知識能夠安放的故事。這個故事，科學無法提供。它必須由我們自己去找，去建，去選擇。</p>"}, {"day": 83, "title": "民族主義、共產主義：填補信仰空洞的嘗試", "body": "<p>宗教退潮留下的那片空地，沒有空太久。各種新的意識形態，爭先恐後地湧進去，試圖填補那個空洞。</p><p>十九世紀最強大的替代品，是民族主義。民族主義說：你的意義，在你的民族裡。你屬於一個有共同語言、共同血脈、共同歷史的偉大集體，你的個人生命，因為這個歸屬而有了意義，甚至值得為它犧牲。</p><blockquote>但民族主義走向極端，會通向哪裡，二十世紀已經給出了答案：兩次世界大戰，大屠殺，種族清洗。當「我們」的意義建立在「他們」的低劣和威脅上，愛就變成了仇恨的另一個面孔。</blockquote><p>共產主義，是另一種替代品。馬克思說：歷史有一個方向，那個方向是工人階級的解放，是一個沒有剝削的理想社會。為了那個理想，個人的犧牲是有意義的，革命的暴力是必要的。它在二十世紀吸引了無數知識分子和理想主義者。結果，蘇聯、中國、柬埔寨——以解放之名，製造了人類歷史上最大規模的屠殺之一。</p><p>為什麼這些意識形態都走向了暴力？它們都宣稱掌握了歷史的終極真理，都把那個真理凌駕於個別人的生命之上，都有一個「為了更大的善可以犧牲個體」的內在邏輯。四聖哲裡，沒有一個人是這樣思考的。他們的出發點，永遠是眼前的那一個人的苦難，不是抽象的集體。意義，不能建立在別人的犧牲上。</p>"}, {"day": 84, "title": "消費主義：買更多，就更幸福？", "body": "<p>今天，在大多數民主社會裡，既沒有強制的宗教，也沒有強制的意識形態。我們有一樣東西，更溫柔，更隱形，但同樣無處不在：消費主義。</p><p>消費主義是現代資本主義和廣告業共同演化出來的一種文化邏輯：你的身份由你擁有什麼定義，你的幸福由你消費什麼實現，你的人生目標，就是不斷升級你的擁有。</p><blockquote>廣告業每年花費數千億美元，做的事情只有一件：製造不滿足感。讓你覺得自己的車不夠新，臉不夠好看，生活不夠精彩，然後告訴你，解決方案就在他們的產品裡。這是一個精密設計的意義製造機器，但它製造的意義是空心的——因為它的運作，依賴你永遠不被滿足。</blockquote><p>最諷刺的是，消費主義也吞噬了那些原本有更深意義的東西。聖誕節，本來是一個宗教節日，現在主要功能是年度消費高峰。旅行，本來是拓展視野的人文體驗，現在很多時候是為了產出可以發布的照片。</p><p>問題不是消費，而是當消費成為意義的替代品，當「擁有更多」成為人生的主要目標，人就把自己的靈魂，出賣給了一個永遠無法滿足的機器。佛陀說過：渴愛是苦的根源。他說的，不只是那個時代的苦，也是我們這個時代的苦。只是形式換了：從對解脫的渴愛，變成了對下一件產品的渴愛。本質，是一樣的。</p>"}, {"day": 85, "title": "錢可以帶來幸福嗎？研究怎麼說", "body": "<p>讓我們把這個問題，從哲學帶到數據。</p><p>2010年，普林斯頓大學的丹尼爾·卡尼曼和安格斯·迪頓發表了一項研究，分析了45萬個美國人的調查數據，試圖找出收入和幸福感之間的關係。他們發現，收入的增加，確實可以提升幸福感，但只到一個點：當時大約是年收入75,000美元。超過這個數字，情緒幸福感不再隨收入增加而顯著提升。</p><blockquote>簡單來說：錢在匱乏的時候，對幸福的影響是巨大的。解除貧窮的痛苦，是錢最有力的功能。但超過了基本需求的滿足，金錢帶來的幸福增益，會越來越小，越來越短暫。這和伊壁鳩魯兩千三百年前說的話，驚人地吻合：真正的快樂，不來自更多，而來自夠了。</blockquote><p>研究幸福科學的學者還發現，對幸福感影響最持久的，不是收入，不是物質，而是幾件看起來很「老派」的事：深刻的人際關係、有目的感的工作、感恩的習慣、對當下的專注、以及對比自己更大的事物的貢獻。</p><p>哈佛大學有一個已持續八十多年的「成人發展研究」，追蹤了幾百個人的一生。它最重要的結論，由研究負責人羅伯特·瓦爾丁格說出：讓人到老年時仍然健康快樂的，不是財富，不是名聲，不是努力工作，而是良好的人際關係。這些研究，都在說同一件事：人類為幸福設計的最佳條件，不是現代社會主要提供的那些東西。</p>"}, {"day": 86, "title": "二十世紀：人類有能力毀滅自己，卻不知為何存在", "body": "<p>1945年8月6日，早上8時15分，廣島。一顆原子彈在城市上空580米處爆炸，在0.3秒內，爆炸中心的溫度達到了幾千萬攝氏度，相當於一小個太陽。在隨後幾秒裡，大約70,000人幾乎直接蒸發。到年底，死亡人數達到了約14萬人。三天後，長崎。人類第一次，擁有了毀滅自己的能力。</p><blockquote>物理學家奧本海默，看著第一顆原子彈試爆成功的那個蘑菇雲，想起了印度史詩《薄伽梵歌》裡的一句話：「現在我成了死神，世界的毀滅者。」這句話，不是驕傲，是恐懼。一個在科學上走得最遠的人，在那一刻感受到了人類理性的可能後果。</blockquote><p>二十世紀，是人類歷史上物質進步最快、同時暴力規模最大的世紀。兩次世界大戰殺死了大約一億人。大屠殺用工業化的方式，系統性地消滅了六百萬猶太人。史達林的大清洗，毛澤東的文化大革命，波爾布特的柬埔寨，盧安達的種族屠殺——每一件，都是在某種意識形態的旗幟下進行的，每一件，都是人對人做的。</p><p>二十世紀提出了一個讓人類至今無法完全回答的問題：我們的理性和科學，讓我們有能力做任何事，但那個能力本身，不會告訴我們應該做什麼。技術是中性的，可以治病，也可以殺人。決定技術用途的，是人心。而人心，需要的不是更多技術，是智慧，是道德，是那些四聖哲兩千五百年前就在追問的東西。我們走到了月球，卻仍然在問：我們為什麼在這裡？</p>"}, {"day": 87, "title": "存在主義：面對虛無，我們怎辦？", "body": "<p>在二十世紀的廢墟上，有一批哲學家，直視著那片虛無，不轉身，不逃跑，試圖在那裡找到一個誠實的立足點。他們叫存在主義者。</p><p>沙特，1905年生，說出了那個時代最驚人的一句話：存在先於本質。傳統的思想方式，是先有本質（神賦予人一個目的、一個本性），然後才有存在。沙特把它倒過來：你先是存在了，然後你用你的選擇，創造你自己的本質。沒有人替你定義你是誰，你完全自由，也完全責任自負。</p><blockquote>卡繆，則用「荒謬」來描述人的處境：人渴望意義，但宇宙沉默，不給任何答案。這個渴望和沉默之間的張力，就是荒謬。他的問題，和他的答案一樣著名：既然一切都是荒謬的，為什麼不自殺？他的回答：因為反抗本身就是意義。我們必須想像西西弗斯是快樂的。</blockquote><p>波伏娃，把存在主義應用到女性處境：如果人是自由的，那麼女性被定義為「第二性」，被規限在家庭和從屬角色裡，就是對自由的根本剝奪。她的《第二性》，成為二十世紀女性主義運動最重要的理論基礎。</p><p>存在主義的貢獻，不是給出了答案，而是誠實地說：沒有現成的答案，你必須自己選擇，自己承擔，自己成為你選擇成為的人。但它也有一個局限：如果意義完全由個人創造，那麼連結、慈悲、愛他人——這些超越個體的價值，從哪裡來？存在主義給了我自由，但它沒有告訴我為什麼在乎你。</p>"}, {"day": 88, "title": "我們需要一套保留理性的信念體系", "body": "<p>我們走到了這裡。宗教退潮，留下意義的空洞。民族主義和意識形態試圖填補，卻帶來了屠殺。消費主義用物質麻醉，卻帶不來真正的滿足。科學解釋了宇宙，卻解釋不了我們為何在乎彼此。存在主義給了我們誠實，卻給不了我們方向。</p><p>我們需要什麼？我認為，我們需要一套信念體系，能夠同時做到三件事：它必須誠實——不依賴對現實的扭曲和謊言，不要求你關閉理性才能接受。它必須提供意義——一種讓你知道自己在做什麼、為什麼做的深層方向感。它必須指向他人——因為所有持久的意義，都有一個超越自我的維度。</p><blockquote>這三個條件，四聖哲的思想，都能滿足。蘇格拉底的求真精神，滿足第一個；佛陀對苦難和解脫的洞見，滿足第二個；孔子的仁和耶穌的愛，滿足第三個。而且，四者彼此補充，缺一不可。</blockquote><p>但我不是要說：四聖哲的思想，已經是完整的答案，我們只要「返古」就好。歷史不能倒流，我們活在一個他們沒有預見過的世界——有人工智能，有核武器，有全球氣候危機。我們需要的，是他們的精神，而不是他們的答案。那個不停追問的精神，那個對人的在乎，那個相信每一個當下都是道德選擇的時刻——這些，放在任何時代都有效，包括這個時代。</p><p>人文精神，是活的，它需要活在人身上，才能活著。接下來的八天，我們談實踐。不是抽象的理念，而是具體的、你明天就可以嘗試的事。因為一套沒有活出來的信念，只是文字。</p>"}]}, {"title": "第九章：人文精神的實踐", "articles": [{"day": 89, "title": "人文精神不只是四大聖哲", "body": "<p>走到這裡，我要說一件重要的事，免得這個系列給人留下一個錯誤的印象。</p><p>過去八十八天，我們花了大量時間在四個男人身上。他們是偉大的，他們的思想值得我們用一生去消化。但如果人文精神只住在這四個人身上，它就是一個博物館裡的展品，不是一條流動的河。</p><p>人文精神更廣闊。它住在每一個選擇在乎的人身上。它住在南非種族隔離制度最嚴苛的年代，仍然堅持讓每一個學生知道自己有尊嚴的老師身上，沒有人記得她的名字。它住在盧安達種族屠殺中，那些冒著生命危險藏匿鄰居的胡圖族人身上，他們知道被發現的代價，仍然選擇打開門。它住在每一個在急症室熬通宵的護士身上，每一個在深夜接起危機熱線的義工身上。</p><blockquote>人文精神不需要偉大。它只需要真實。在那個具體的時刻，那個具體的人面前，你選擇在乎，而不是漠然。這就夠了。</blockquote><p>它也住在那些用創造力記錄人性的人身上。托爾斯泰在《戰爭與和平》裡，讓我們看見在歷史的巨輪下，每一個普通人的掙扎和愛；魯迅在《吶喊》裡，對著沉睡的鐵屋子大聲呼喊；張愛玲在亂世的上海，用最精緻的文字，寫人在歷史縫隙裡的愛與恨。</p><p>它住在科學家身上。約納斯·索爾克發明了小兒麻痺症疫苗，有人問他要不要申請專利，他說：你能為太陽申請專利嗎？他把那個可以讓他致富的發明，免費送給了全人類。</p><p>人文精神的大河，是由無數這樣的滴水匯成的。你是其中一滴，我也是。明天開始，我們談具體的實踐。</p>"}, {"day": 90, "title": "曼德拉、居里夫人：現代人文精神的面貌", "body": "<p>讓我說兩個故事。</p><p>第一個，關於一個在監獄裡待了二十七年的人。尼爾遜·曼德拉，1964年被南非種族隔離政府以破壞國家安全罪判處終身監禁，關押在羅本島的石灰岩採石場。他每天在烈日下敲石頭，石灰的粉塵損害了他的視力，他的牢房只有幾平方米，沒有床，冬天靠牆壁取暖。在那二十七年裡，他有足夠的時間變得憤怒。有足夠的理由渴望復仇。</p><blockquote>他說過一句話：當我走出那扇門，我知道如果我不把痛苦和怨恨留在身後，我就仍然是囚犯。他選擇了自由，不是地理上的自由，而是心裡的自由。他後來領導的南非和解進程，建立了「真相與和解委員會」，讓南非避免了一場可能摧毀整個國家的內戰。</blockquote><p>曼德拉不是沒有憤怒，他是選擇了不讓憤怒成為他的身份。這，是孔子說的「克己」，是耶穌說的「愛仇敵」，是佛陀說的放下執著，活生生地，活在一個二十世紀的人身上。</p><p>第二個故事，關於一個選擇貧窮的天才。瑪麗·居里，兩度獲得諾貝爾獎，是迄今唯一在兩個不同科學領域獲得諾貝爾獎的人。她可以憑此致富，她沒有。她把鐳的提純方法公開，不申請專利，讓全世界的科學家都可以免費使用。她說：科學是全人類的，不屬於任何一個人。她後來因長期接觸放射性物質患上再生障礙性貧血，在1934年去世。她把自己的身體，也獻給了科學。</p><p>兩個人，一個政治家，一個科學家，相隔半個世紀，在不同的大陸，做著表面上完全不同的事。但他們身上，有同一顆心：把一樣比自己更大的東西，放在自己的得失之前。這顆心，就是人文精神在現代世界最真實的面貌。</p>"}, {"day": 91, "title": "音樂、詩詞、飲食：文化也是人文精神", "body": "<p>人文精神不只活在偉人身上，也活在文化裡。我說的文化，不是那個博物館和學術論文裡的「文化」，而是更日常的、更廣義的：一個地方的人，如何共同創造意義，如何把人類的經驗，用可以被傳遞的形式保存下來。</p><p>音樂，是人類最古老的語言之一，比文字早得多。貝多芬在完全失聰的情況下寫出第九交響曲，在首演時，他站在舞台上，在音樂結束之後仍然背對著觀眾揮手，完全聽不見身後的掌聲和歡呼。一個音樂家友人輕輕碰了碰他的肩膀，讓他轉身。他看見了那片人潮，看見了那些揮動的手帕和抹去的眼淚。據說他也哭了。</p><blockquote>音樂做到了語言做不到的事：它直接觸碰感受，不經過理性的過濾。你不需要理解樂理，不需要懂德文，就可以被《第九》的終樂章那種對人類兄弟情誼的渴望所打動。這種跨越語言和文化的觸動，是人類共同人性最直接的證明之一。</blockquote><p>詩詞，是另一種形式。在中文世界，幾千年的詩詞傳統裡，有一種獨特的能力：把最私密的感受，用最精煉的語言，寫成可以被陌生人在千年後讀到並深深共鳴的文字。</p><p>杜甫在安史之亂的戰火裡寫：烽火連三月，家書抵萬金。一千三百年後，每一個和家人分隔兩地的人，讀到這句話，仍然感到那個重量。李白在窗前看月，舉頭望明月，低頭思故鄉——這個動作，這個轉折，讓全世界任何一個在異鄉的人，都能在裡面找到自己。</p><p>飲食，聽起來最世俗，卻也是人文精神最具體的載體之一。一道菜，承載著一個地方的土地、氣候、歷史和人的創造力。廣東人的煲湯，煮的不只是食材，是幾代人積累的對家人身體的在乎；日本料理師傅對一條魚的處理方式，是一種對食材本身的尊重；台灣的夜市，是城市的客廳，是人與人之間最沒有障礙的相遇場所。</p><p>保存文化，就是保存人類共同積累的智慧和美麗。下一次你吃到一道讓你感動的食物，不妨停下來想一想：是誰的手，把這個味道傳給了我？</p>"}, {"day": 92, "title": "將別人看作人：最小但最重要的善行", "body": "<p>讓我說一件很小的事。</p><p>有一天，我在超市排隊結賬。前面的收銀員是一個大概五十歲的女人，動作熟練，但臉色疲憊。她低著頭掃貨，沒有和任何顧客對視。</p><p>輪到我了。我把東西放上去，然後——我也不知道為什麼——我說：「你今天好嗎？看你很忙。」</p><p>她抬起頭，愣了一下，然後笑了。那個笑，有點不知所措，但也有點真實。她說：「還好，謝謝你問。」</p><blockquote>把別人看作人——這句話說起來像廢話，做起來卻比我們以為的難得多。因為我們的大腦，為了效率，會把大多數與我們互動的人「功能化」：那是司機，那是服務員，那是收銀員，那是客服。他們在我們的心理地圖裡，是工具，不是人。</blockquote><p>這不是惡意，而是認知的捷徑。問題是，當我們長期用這種方式看世界，我們不只是對他人不公平，我們也讓自己變得更窄、更冷，更少感受到生活裡那些細小的溫度。</p><p>哲學家馬丁·布伯，把人際關係分成兩種：「我－它」（I-It）關係，是把對方視為達到目的的工具；「我－你」（I-Thou）關係，是真正把對方視為一個完整的主體，一個有自己的內心世界、自己的苦與樂的人。他說，所有真實的生命，都發生在「我-你」的相遇裡。</p><p>怎麼做到？幾個很小的事：對服務你的人說謝謝，並且看著他們的眼睛說。記住和你長期互動的人的名字。在別人說話時，真的聽，不要同時想著自己等一下要說什麼。問一個你平時不會問的問題：「你最近還好嗎？」然後，真的等待答案。</p><p>這些事，沒有一件需要花超過三十秒。但累積起來，它們會改變你和周圍世界的關係，也會改變你這個人。孔子說仁者愛人。愛，不一定是轟轟烈烈的犧牲，有時候，它只是那三十秒的停留，那一個真實的對視，那一句「你好嗎」。從今天開始，找一個你平時「功能化」了的人，試著把他還原回去。</p>"}, {"day": 93, "title": "每日修行：人文精神如何變成習慣？", "body": "<p>有一個問題，我在寫這個系列的過程中，不斷被人問到：這些都很好，但我要怎麼「做」？</p><p>這個問題很誠實，也很重要。思想不能停留在思想裡，它必須落入生活，才有意義。</p><p>早上醒來，在拿起手機之前，給自己三分鐘。不需要冥想，不需要打坐，只是靜靜地躺著，問自己：今天，我最想成為什麼樣的人？有沒有一件事，我可以做得比昨天更有意識、更有溫度？</p><blockquote>這三分鐘，不是要你制定人生計劃，而是在一天開始之前，把自己的指南針拿出來看一看，確認方向。就像斯多葛派的晨間默想：今天可能會遇見什麼困難，我可以如何回應？</blockquote><p>吃飯的時候，如果和家人或朋友一起，試著真正在場。不看手機，不想工作，只是在那個飯桌上。問一個真實的問題：今天有沒有什麼讓你開心或難過的事？然後，聽。</p><p>睡前，給自己五分鐘回顧這一天。不是評判自己做得好不好，而是問：今天，有沒有一個時刻，我覺得自己是真正在活著，而不是只是在運轉？那個時刻是什麼？明天，我可以創造更多這樣的時刻嗎？</p><p>這個習慣，是從本傑明·富蘭克林那裡學來的。他每天早晨問自己：「今天我要做什麼好事？」每天晚上問自己：「今天我做了什麼好事？」他把這個習慣保持了幾十年。一個每日的自問，是他所有成就的內在發動機。</p><p>另一個值得養成的習慣，是閱讀。不是瀏覽，不是滑動，而是真正的、坐下來的、讓一本書改變你的閱讀。每天哪怕只有二十分鐘，一年下來，你可以讀完大約二十本書。二十本好書，足以讓一個人的世界觀發生真實的改變。</p><p>還有一個更小的習慣：每天找一件值得感謝的事，把它寫下來，哪怕只是一句話。研究顯示，定期書寫感恩，可以顯著提升長期幸福感，降低抑鬱風險。感恩不是否認問題，而是在問題存在的同時，也認真看見那些值得珍惜的事。</p><p>亞里士多德說：我們是習慣的總和。你每天做的那些看起來很小的選擇，累積起來，就是你這個人。人文精神，不是一次的覺醒，而是每一天的選擇。</p>"}, {"day": 94, "title": "閱讀經典：讀什麼？怎樣讀？", "body": "<p>有人問我：你說要閱讀經典，但經典這麼多，從哪裡開始？</p><p>讓我先說清楚「經典」在我這裡是什麼意思。義大利作家卡爾維諾說，經典是那些你在讀第二遍、第三遍的時候，仍然有新發現的書；是那些在你生命的不同階段，讀出不同意味的書；是那些讓你覺得「我早就知道這個」的書，即使你以前從未讀過，因為它說的是某種你心裡一直知道但從未找到語言的東西。</p><blockquote>《論語》，是最容易讀的哲學經典之一。它不是連貫的論文，而是一段一段的對話和語錄，可以從任何地方開始，每天讀幾段，想一想，放下，明天再讀。它的魅力，在於每次重讀都能在不同的人生階段照出不同的自己。</blockquote><p>《沉思錄》，馬可·奧理略的私人日記，斯多葛哲學最動人的文本。一個統治天下的人，在日記裡一遍又一遍地提醒自己要謙遜、要公正、要不被情緒左右。讀這本書的時候，你會感覺到他在努力，感覺到那個努力的真實，然後也想努力。</p><p>《活出意義來》，維克多·弗蘭克，在集中營裡寫成的書，關於人在最極端的苦難中如何找到意義。這本書的力量，在於它不是理論，而是親歷。弗蘭克不是在書齋裡思考意義，他是在地獄裡找到意義。</p><p>《傳道書》，舊約聖經裡最具哲學深度的篇章，一個古代智者面對「日光之下無新事」的虛空，寫下的沉思。它的誠實，它的不迴避，讓它在兩千五百年後仍然讓人讀到想停下來。</p><p>怎樣讀？幾個原則。慢讀。經典不是用來快速消化的，它是用來咀嚼的。讀到一個讓你停下來的句子，就停下來，不要繼續，想一想那句話為什麼讓你停住，它說的是什麼，它和你的生命有什麼關係。</p><p>帶著問題讀。不是漫無目的地翻頁，而是帶著你此刻真實的困惑去讀。你在對抗什麼？你在想什麼問題？帶著這個問題打開一本書，書裡的回應，會比你在不帶任何問題的情況下讀到的更有力量。</p><p>和人討論。一本書，自己讀和和人討論，是完全不同的體驗。討論迫使你把模糊的感受說清楚，迫使你面對自己的論點的漏洞，也讓你看見別人從同一本書裡讀出的完全不同的東西。</p><p>最後，不要因為「應該讀」而讀。讀你真正感到好奇的書，讀讓你有點不舒服的書，讀讓你想立刻打電話告訴朋友的書。讀書，不是完成一份清單，而是和一個人坐下來，認真說話。</p>"}, {"day": 95, "title": "人文精神需要群體：你身邊有同行者嗎？", "body": "<p>有一件事，我在這個系列的開頭就想說，但一直留到現在。一個人，很難長期維持一種需要努力的精神狀態。</p><p>我不是在說弱點，我是在說事實。人是社會動物，我們的信念、我們的價值觀、我們的習慣，都深深受到周圍的人影響。心理學有一個研究：你最親密的五個朋友的平均收入、平均體重、平均幸福感，往往和你自己非常接近。環境的力量，比我們願意承認的更大。</p><p>這意味著：如果你周圍的人都不在乎自我修養，都只談錢和消費，都對更深的問題漠然——你要逆流而上，需要耗費巨大的精神能量，而且很難持久。這不是叫你換朋友，而是說：你需要找到同行者。</p><blockquote>佛教有「僧團」（sangha），是三寶之一，和佛陀（覺悟的力量）、佛法（覺悟的道路）並列。僧團的意義，不只是一群同類人聚在一起，而是在共同的修行中互相支撐、互相提醒、互相激勵。基督徒有教會，儒者有書院，哲學家有學派——這些群體，不是可選配件，而是任何深刻的精神修行都需要的基礎設施。</blockquote><p>你的同行者，不需要是完美的人，不需要和你完全一致，不需要一起讀同樣的書或信仰同樣的東西。他們只需要有一個共同的方向：認真地活，認真地思考，認真地在乎。</p><p>在香港，有一些已有的社群可以是起點。哲學學會、讀書會、社區義工組織、冥想課程、寫作工作坊……這些地方，聚集了一些願意在日常生活的表面之下，認真找東西的人。你不一定要喜歡每一個人，但你可能會找到幾個，讓你覺得「和這個人說話，讓我成為更好的自己」。那種人，值得珍惜。</p><p>讀書會，門檻最低。找三五個朋友，每個月讀一本書，然後聚在一起說話。不需要有人主持，不需要有人是專家，只需要每個人都真的讀了，真的想說。這樣的對話，往往比任何一本書本身更有力量。</p><p>孔子周圍，有三千學生。耶穌身邊，有十二個門徒。佛陀有他的比丘和比丘尼。他們不只是傳道者，他們也是群體的建造者，因為他們知道：一個人，難以持久；一群人，可以走得更遠。你身邊，有沒有這樣的人？如果有，珍惜他們。如果沒有，從今天開始找，或者建。</p>"}, {"day": 96, "title": "AI與機器人：人文精神在新時代更需要", "body": "<p>2023年，ChatGPT的出現，讓全世界突然開始認真討論一個以前只在科幻小說裡出現的問題：如果機器能夠思考，人類還有什麼是獨特的？</p><p>AI，在某些方面，已經超越了人類。它可以在幾秒內寫出一篇流暢的文章，在幾分鐘內生成一幅逼真的圖像，在醫療影像的診斷上，準確率已超過部分人類醫生。它不需要睡眠，不會疲倦，不受情緒影響。</p><blockquote>在人與機器之間的邊界不斷被侵蝕的時代，人文精神不是變得不重要了，而是變得更重要了。因為正是在這種處境裡，我們才最需要認真回答：人的價值，究竟在哪裡？</blockquote><p>AI可以寫詩，但它不知道為什麼而寫。它沒有失去過愛人，沒有在深夜的床上睡不著，沒有在父母的葬禮上強撐著說謝謝。它的詞語，可以組合出傷痛的形狀，但那個形狀背後，沒有真實的傷痛。</p><p>AI可以幫你做決定，但它做的每一個決定，都是基於你給它的數據和你設定的目標函數。它不會問你：你確定這是你真正想要的嗎？它沒有蘇格拉底的那顆牛虻，它不會讓你不舒服，不會挑戰你的前提。</p><p>意義、在乎、掙扎、成長——這些，需要一個真實的主體，一個有限的、會死的、在時間裡存在的人，才能發生。一個不會死的機器，無法真正懂得死亡；一個沒有選擇的系統，無法真正懂得勇氣。</p><p>在AI的時代，人文精神不應該萎縮，而應該加強。不是因為它能讓你在就業市場更有競爭力，而是因為它教的，是那些讓你成為一個人而不是一台機器的東西：批判性思考、道德判斷、對他人的同理、對意義的追求。</p><p>蘇格拉底的提問，在AI的時代更需要。佛陀的慈悲，在AI的時代更需要。孔子的仁，在AI的時代更需要。耶穌的愛，在AI的時代更需要。</p><p>那四個字，兩千五百年了，從未過時。最後四天，我們收尾。</p>"}]}, {"title": "第十章：結語與展望", "articles": [{"day": 97, "title": "人類走出地球：我們準備好了嗎？", "body": "<p>1972年12月7日，阿波羅17號的太空人，在距離地球約45,000公里的太空中，拍下了一張照片。</p><p>那張照片，後來被稱為「藍色彈珠」（The Blue Marble）。整個地球，在宇宙的黑暗背景裡，是一顆發著藍色光芒的小小球體。看不見任何邊界，看不見任何國家，看不見任何戰線——只有那一顆球，脆弱，美麗，孤懸在虛空中。</p><p>很多在太空中看見這個景象的太空人，回到地球之後都描述了一種深刻的改變。科學家把這種現象稱為「總觀效應」（Overview Effect）：從太空看見地球，會讓人對人類命運共同體產生一種強烈的、幾乎是宗教性的感受。邊界消失了，差異縮小了，只剩下那顆藍色的球，和一種深深的、「我們必須好好照顧它」的責任感。</p><blockquote>現在，人類正在認真計劃重返月球，然後前往火星。這個目標，在技術層面也許是可行的。但它提出了一個技術層面以外的問題：我們準備好了嗎？不是技術上的準備好，而是道德上的準備好。</blockquote><p>我們在地球上，幾千年來，仍然沒有解決戰爭、貧富不均、種族歧視、對弱者的壓迫。我們把地球的生態系統推向了臨界點，海洋裡的塑料已經滲入最深的海溝，氣候變化正在讓數億人面臨存亡威脅。我們擁有毀滅整個星球的武器，卻仍然在為邊界和資源爭奪不休。</p><p>帶著這樣的人性，走向火星，走向更遠的宇宙，我們會帶去什麼？</p><p>但也有另一種可能。那張「藍色彈珠」的照片，是人文精神的一個視覺宣言。它說：我們是同一個物種，住在同一顆小小的球上，我們的命運是共同的。如果每一個走向太空的人，都帶著這個認識，帶著那種總觀效應帶來的謙遜和責任感，也許，人類走出地球，不是把地球的傷帶向宇宙，而是在一個更廣闊的舞台上，重新學習如何好好地活在一起。</p><p>蘇格拉底、佛陀、孔子、耶穌，都沒有預見到這個問題。但他們給的答案，仍然適用：仁、慈悲、愛智、愛。不管是在雅典的廣場，在菩提樹下，在魯國的馬車上，在加利利的曠野，還是在火星的紅色塵土上。</p><p>人文精神，是我們帶向宇宙最重要的行李。它比任何火箭都更難建造，也比任何火箭都更需要。</p>"}, {"day": 98, "title": "我怎樣找到人文精神這條大河", "body": "<p>今天，容許我說一些很私人的事。</p><p>我自小便喜愛思考人生意義這個問題，或者說，這個問題很早就找上了我，讓我沒有辦法不去想它。大概是高中的時候，有一段時間我非常迷惑。不是青春期的普通迷惑，而是一種更根本的：我不知道為什麼每天早上要起床，不知道讀書、工作、成功，這一切究竟是為了什麼。</p><p>那時候，我去過教會。有幾年，我認真嘗試把信仰作為答案——那個答案，給了我一個群體，給了我一套語言，給了我一些安慰。但最終，我遇到了一些誠實無法迴避的問題，我無法讓自己停止問那些問題，所以我離開了。</p><p>之後，我讀了很多書，走了很多路，裸辭過，流浪過，在不同的地方待過，遇見過不同的人，試圖在這些經歷裡找到那個答案。</p><blockquote>但那個空洞，一直在。不是每天都感受得到，有時候很長一段時間它都安靜，但它從未消失。它是我的底色，是那個讓我在夜深人靜的時候仍然感到懸空的東西。</blockquote><p>然後，有一天，我想起了蘇格拉底。不是突然的天啟，而是在讀一段文字的時候，忽然被什麼擊中了。蘇格拉底說，他的使命是成為雅典的牛虻，讓那頭懶馬保持清醒。他不是因為有答案才開口，他是因為問題本身讓他沉默不下去。</p><p>我想到孔子，在顛沛流離的馬車上，明知道他的理想在有生之年看不到，仍然繼續。我想到弗蘭克，在集中營裡，在一切都被奪走之後，仍然選擇相信生命有意義。我想到那些我仰慕的人——不只是偉人，還有我見過的一些普通人，他們臉上的那種平靜，那種對生活的認真，那種即使在困難裡仍然有溫度的心。</p><p>在那個時刻，我仿佛成為一滴水，找到了一條河。</p><p>不是說我找到了所有問題的答案。那個底色的懸空，有時候仍然在。我仍然不知道死後有沒有什麼，仍然不知道宇宙是否有目的，仍然不知道歷史最終走向哪裡。</p><p>但我知道，我不孤單。在我之前，有幾千年的人，帶著同樣的問題，走過這條路，留下了他們的思考、他們的掙扎、他們的答案和半個答案。他們的存在，讓我的問題不再是孤立的焦慮，而是人類共同冒險的一部分。</p><p>我知道，那顆心是真實的——那顆在看見苦難時不轉身的心，那顆相信每一個人都值得被認真對待的心，那顆即使不能解決一切問題，仍然選擇在乎的心。這顆心，讓我知道每一天值得認真活。</p><p>這個系列，是我試圖把那條河的輪廓，用一百天的文字描繪出來。不是因為我已經完全理解了它，而是因為在描繪的過程中，我更深地感受到了它的存在。寫這些文字，對我來說，也是一種修行。</p>"}, {"day": 99, "title": "你不孤單：千萬人在同一條河裡", "body": "<p>今天，我想和你說一件事。</p><p>不管你是怎樣找到這個系列的，不管你讀了一天還是九十九天，不管你同意我說的還是有很多地方覺得我說錯了——你在這裡，你讀到這裡，說明有什麼東西讓你留下來了。</p><p>也許是好奇。也許是某一天，某一篇文章裡的某一句話，擊中了你也在問的那個問題。也許是因為你在某個地方感到迷失，想找一個方向。</p><p>無論是什麼原因，我想告訴你：你不孤單。</p><p>那個讓你留下來的東西——那個對意義的追尋，那個對「人應該怎樣活」的疑問，那個在深夜裡感到懸空、想找一個落腳點的衝動——這不是你一個人的困境。這是人類最古老的共同困境。</p><p>蘇格拉底有這個困境，所以他在廣場上攔住陌生人問問題。佛陀有這個困境，所以他在三十五歲那年坐在一棵樹下，發誓不得解脫不起身。孔子有這個困境，所以他在六十多歲，帶著一群學生，在戰亂的中原流浪了十四年。耶穌有這個困境，所以他在三十歲，走向曠野，四十天獨自面對最深的誘惑和疑問。</p><blockquote>在他們之後，有無數的人，帶著同樣的困境，走過這條路。有些人找到了答案，有些人只找到了一半，有些人帶著問題走到了最後，卻在那個帶著問題走的過程裡，活出了值得的一生。</blockquote><p>在那些感到疲倦的時刻，我想請你記得幾件事。</p><p>弗蘭克說：人能從你身上奪走一切，除了一樣：在任何處境下，選擇你的態度的自由。那個選擇，哪怕沒有人知道，它仍然是真實的，它仍然有重量，它仍然是你這個人最深的核心。</p><p>孔子說，吾日三省吾身。不是每年一次，而是每天，問自己：我做到了嗎？那個持續的、日常的自我檢視，本身就是修行，本身就是對人文精神的實踐。</p><p>佛陀說，萬物皆無常，勤加精進。不要等到準備好了再開始。就在這個不確定的、不完美的當下，繼續走，繼續嘗試，繼續選擇在乎。</p><p>耶穌說，你在最微小的事上做的，就是向我做的。不需要做大事才算數，不需要改變世界才有意義。那一個真實的問候，那一個停留的眼神，那一個選擇不冷漠的時刻——都算數。</p><p>你不孤單。千萬人在同一條河裡，和你一起游。有些人在你前面，為你開路；有些人在你旁邊，和你並肩；有些人還沒有出現，將來會因為你走過的痕跡，找到這條河。</p><p>這條河，需要你。</p>"}, {"day": 100, "title": "100日之後，旅程才真正開始", "body": "<p>一百天了。</p><p>我們從雅典走到恆河，從黃河走到約旦河，從中世紀的修道院走到工業革命的工廠，從尼采的「上帝已死」走到矽谷的人工智能，最後，走回到日常生活裡那個普通的早晨，那個你和另一個人相遇的時刻。</p><p>這是一段很長的路。但我必須說一件讓你可能意外的事：</p><p>這一百天，不是終點。它是起點。</p><p>所有的思想，所有的故事，所有那些偉大的人物和他們留下的智慧，如果只停留在這個系列裡，只停留在你讀它的那個時刻的感動，它們的意義，就只到這裡。</p><p>真正的旅程，在你放下手機或電腦，走回你的生活裡，才開始。</p><p>在我寫這最後一篇文章的時候，我想起了四個人。</p><blockquote>蘇格拉底，在監獄裡，喝下毒酒之前，仍然在和朋友討論靈魂不死的問題。他沒有浪費他生命的最後幾個小時在恐懼裡，他在思考，在對話，在做他一生都在做的事。那種從容，不是因為他不害怕，而是因為他知道，哲學是他的生命，而生命，在最後一刻也不需要停止。</blockquote><p>佛陀，在八十歲那年，臨終時對弟子們說了最後的話：萬物皆無常，勤加精進。他把最後的力氣，用在叮囑別人繼續走上。</p><p>孔子，臨終前，扶著門柱，說：太山壞乎！他知道自己的夢想沒有實現，但他沒有說「這一切都是徒勞的」。他哀悼的，是一個他相信本可以更好的世界的失落。那個哀悼，本身，就是愛的另一種形式。</p><p>耶穌，在十字架上，對母親說：婦人，看你的兒子——把她托付給愛徒約翰。在自己死亡的最後時刻，他仍然在在乎另一個人，仍然在安排，仍然在愛。</p><p>四個人，在生命的最後時刻，做的都是同一件事：繼續成為他們一生選擇成為的那種人。</p><p>這，是我在這一百天裡，學到的最深的一課。</p><p>不是某個偉大的哲學體系，不是某個可以解決一切問題的答案，而是一種選擇：選擇在你能選擇的每一個時刻，做那個你想成為的人。今天，再一次。明天，再一次。哪怕昨天沒有做到，今天，再一次。</p><p>如果只能留下一句話，我想留下的，是這個：</p><p>人文精神不是你可以擁有的東西，它是你每天要選擇的事情。</p><p>從今天開始，每一天，選擇在乎。</p><p>選擇看見你面前的那個人。</p><p>選擇問那個你一直沒有勇氣問的問題。</p><p>選擇在那個可以冷漠的時刻，不冷漠。</p><p>這條河，比你我都更長。它從兩千五百年前流來，它會在我們都不在的時候繼續流下去。我們的任務，不是擁有它，不是定義它，而是加入它，讓它流過我們，也讓我們在它之中流動。</p><p>謝謝你，陪我走了這一百天。</p><p>旅程，現在才真正開始。</p><p>—— 100日論盡人文源流 ——</p>"}]}];

// Flatten all articles into a single list with chapter info
const allArticles = [];
DATA.forEach((ch, ci) => {
  ch.articles.forEach((art, ai) => {
    allArticles.push({ ...art, chapterTitle: ch.title, chapterIdx: ci, articleIdx: ai, globalIdx: allArticles.length });
  });
});

let currentGlobal = -1;

// Build sidebar nav
function buildNav() {
  const navList = document.getElementById('nav-list');
  DATA.forEach((ch, ci) => {
    const grp = document.createElement('div');
    grp.className = 'chapter-group';
    const lbl = document.createElement('div');
    lbl.className = 'chapter-label';
    lbl.textContent = ch.title;
    grp.appendChild(lbl);
    ch.articles.forEach((art, ai) => {
      const globalIdx = allArticles.findIndex(a => a.chapterIdx === ci && a.articleIdx === ai);
      const item = document.createElement('div');
      item.className = 'nav-item' + (art.day === 0 ? ' foreword-item' : '');
      item.dataset.idx = globalIdx;
      const daySpan = art.day > 0 ? `<span class="day-num">${art.day}</span>` : '<span class="day-num">序</span>';
      item.innerHTML = daySpan + art.title;
      item.addEventListener('click', () => { openArticle(globalIdx); if(window.innerWidth <= 800) toggleSidebar(false); });
      grp.appendChild(item);
    });
    navList.appendChild(grp);
  });
}

// Build chapter cards for welcome screen
function buildCards() {
  const container = document.getElementById('chapter-cards');
  DATA.forEach((ch, ci) => {
    const card = document.createElement('div');
    card.className = 'chapter-card';
    const chNum = ci === 0 ? '序言' : `第${['一','二','三','四','五','六','七','八','九','十'][ci-1]}章`;
    card.innerHTML = `<div class="ch-num">${chNum}</div><div class="ch-title">${ch.title.replace(/第.章：/,'').replace(/序言：/,'')}</div><div class="ch-count">${ch.articles.length} 篇</div>`;
    const firstIdx = allArticles.findIndex(a => a.chapterIdx === ci);
    card.addEventListener('click', () => openArticle(firstIdx));
    container.appendChild(card);
  });
}

function openArticle(globalIdx) {
  const art = allArticles[globalIdx];
  if (!art) return;
  currentGlobal = globalIdx;

  // Update content
  document.getElementById('art-chapter').textContent = art.chapterTitle;
  document.getElementById('art-day').textContent = art.day > 0 ? `Day ${art.day}` : '序言';
  document.getElementById('art-title').textContent = art.title;
  document.getElementById('art-body').innerHTML = art.body;

  // Prev/next
  const prev = allArticles[globalIdx - 1];
  const next = allArticles[globalIdx + 1];
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  document.getElementById('prev-title').textContent = prev ? prev.title : '';
  document.getElementById('next-title').textContent = next ? next.title : '';
  btnPrev.disabled = !prev;
  btnNext.disabled = !next;

  // Show article, hide welcome
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('article-view').style.display = 'block';

  // Update active nav item
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === globalIdx);
  });

  // Scroll to top of main
  document.getElementById('main').scrollTop = 0;
  window.scrollTo(0, document.getElementById('app').offsetTop - 10);

  // Scroll active nav item into view
  const activeNav = document.querySelector('.nav-item.active');
  if (activeNav) activeNav.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  // Update browser URL
  const slug = art.day > 0 ? `day-${art.day}` : `foreword-${art.articleIdx}`;
  history.replaceState({}, '', `#${slug}`);
}

function navigateArticle(dir) {
  const next = currentGlobal + dir;
  if (next >= 0 && next < allArticles.length) openArticle(next);
}

// Search
let searchTimeout;
document.getElementById('search').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    const q = this.value.trim().toLowerCase();
    const navList = document.getElementById('nav-list');
    const searchList = document.getElementById('search-list');
    if (!q) { navList.style.display = ''; searchList.style.display = 'none'; searchList.innerHTML = ''; return; }
    navList.style.display = 'none';
    searchList.style.display = '';
    const results = allArticles.filter(a =>
      a.title.toLowerCase().includes(q) ||
      a.body.toLowerCase().includes(q) ||
      a.chapterTitle.toLowerCase().includes(q)
    ).slice(0, 20);
    if (!results.length) {
      searchList.innerHTML = '<div class="no-results">沒有找到相關文章</div>';
      return;
    }
    searchList.innerHTML = results.map(a => `
      <div class="search-result-item" onclick="openArticle(${a.globalIdx}); document.getElementById('search').value=''; document.getElementById('nav-list').style.display=''; document.getElementById('search-list').style.display='none';">
        <div class="s-day">${a.day > 0 ? 'Day ' + a.day + ' · ' : '序言 · '}${a.chapterTitle}</div>
        ${a.title}
      </div>`).join('');
  }, 200);
});

// Reading progress bar
window.addEventListener('scroll', () => {
  const doc = document.documentElement;
  const progress = (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
  document.getElementById('progress-bar').style.width = progress + '%';
});

// Mobile sidebar
function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('open', open);
}

// Handle URL hash on load
function handleHash() {
  const hash = location.hash.slice(1);
  if (hash.startsWith('day-')) {
    const day = parseInt(hash.slice(4));
    const art = allArticles.find(a => a.day === day);
    if (art) { openArticle(art.globalIdx); return; }
  }
  if (hash.startsWith('foreword-')) {
    const idx = parseInt(hash.split('-')[1]);
    const art = allArticles.find(a => a.chapterIdx === 0 && a.articleIdx === idx);
    if (art) { openArticle(art.globalIdx); return; }
  }
}

buildNav();
buildCards();
handleHash();
</script>
