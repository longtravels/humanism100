<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100日論盡人文源流 — 人文香港</title>
<meta name="description" content="一個追尋人文精神的一百日旅程，從蘇格拉底、佛陀、孔子、耶穌，走向今天的意義危機與實踐之路。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f7f4ef;
  --ink: #1c1a17;
  --ink-light: #4a4540;
  --ink-faint: #8a847c;
  --gold: #9a7d4a;
  --gold-light: #c4a96e;
  --border: #e0d9d0;
  --sidebar-w: 300px;
  --reading-max: 680px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Serif TC', serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.9;
}

/* ── HERO ── */
#hero {
  background: var(--ink);
  color: var(--cream);
  padding: 80px 40px 70px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
#hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 30% 60%, rgba(154,125,74,0.15) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 30%, rgba(154,125,74,0.08) 0%, transparent 50%);
}
#hero .inner { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
#hero .day-count {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--gold-light);
  text-transform: uppercase;
  margin-bottom: 24px;
}
#hero h1 {
  font-size: clamp(2rem, 6vw, 3.2rem);
  font-weight: 500;
  letter-spacing: 0.06em;
  line-height: 1.25;
  margin-bottom: 16px;
}
#hero .subtitle {
  font-size: clamp(0.85rem, 2.5vw, 1rem);
  color: rgba(247,244,239,0.55);
  letter-spacing: 0.12em;
  margin-bottom: 36px;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 300;
}
.hero-divider {
  width: 48px;
  height: 1px;
  background: var(--gold);
  margin: 0 auto 32px;
  opacity: 0.6;
}
#hero .quote {
  font-size: 0.9rem;
  color: rgba(247,244,239,0.45);
  font-style: italic;
  letter-spacing: 0.04em;
}
.sage-row {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin: 32px 0 0;
  flex-wrap: wrap;
}
.sage-tag {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--gold-light);
  border: 1px solid rgba(154,125,74,0.4);
  padding: 5px 14px;
  border-radius: 2px;
  opacity: 0.8;
}

/* ── LAYOUT ── */
#app { display: flex; min-height: calc(100vh - 300px); }

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: #f2ede6;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 28px 0 60px;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-header {
  padding: 0 20px 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.sidebar-header .label {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-bottom: 8px;
}
#search {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  background: var(--cream);
  border-radius: 4px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 13px;
  color: var(--ink);
  outline: none;
}
#search:focus { border-color: var(--gold); }
#search::placeholder { color: var(--ink-faint); }

.chapter-group { margin-bottom: 4px; }
.chapter-label {
  padding: 10px 20px 6px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 400;
}
.nav-item {
  display: block;
  padding: 6px 20px 6px 24px;
  font-size: 13px;
  color: var(--ink-light);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.15s;
  line-height: 1.5;
  font-family: 'Noto Serif TC', serif;
  font-weight: 300;
}
.nav-item:hover { background: rgba(154,125,74,0.08); color: var(--ink); }
.nav-item.active { border-left-color: var(--gold); color: var(--ink); background: rgba(154,125,74,0.06); font-weight: 400; }
.nav-item .day-num {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px;
  color: var(--ink-faint);
  margin-right: 6px;
  display: inline-block;
  min-width: 28px;
}
.nav-item.foreword-item { font-style: italic; }

/* ── MAIN CONTENT ── */
#main {
  flex: 1;
  padding: 60px 48px 100px;
  min-width: 0;
}

/* ── WELCOME SCREEN ── */
#welcome {
  max-width: var(--reading-max);
  margin: 0 auto;
}
#welcome h2 {
  font-size: 1.6rem;
  font-weight: 400;
  letter-spacing: 0.05em;
  margin-bottom: 20px;
  color: var(--ink);
}
#welcome p {
  color: var(--ink-light);
  margin-bottom: 16px;
  font-size: 0.95rem;
}
.chapter-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-top: 40px;
}
.chapter-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 20px 18px;
  cursor: pointer;
  transition: all 0.2s;
}
.chapter-card:hover {
  border-color: var(--gold-light);
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  transform: translateY(-2px);
}
.chapter-card .ch-num {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--gold);
  margin-bottom: 8px;
}
.chapter-card .ch-title {
  font-size: 0.9rem;
  line-height: 1.5;
  color: var(--ink);
  font-weight: 400;
}
.chapter-card .ch-count {
  margin-top: 10px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px;
  color: var(--ink-faint);
}

/* ── ARTICLE VIEW ── */
#article-view { display: none; max-width: var(--reading-max); margin: 0 auto; }

.article-meta {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.article-chapter {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.article-day {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--ink-faint);
  margin-bottom: 10px;
}
.article-title {
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1.35;
  color: var(--ink);
}

.article-body { font-size: 1rem; line-height: 2; color: var(--ink); }
.article-body p { margin-bottom: 1.4em; }
.article-body blockquote {
  margin: 2em 0;
  padding: 0.6em 0 0.6em 1.2em;
  border-left: 2px solid var(--gold-light);
  color: var(--ink-light);
  font-size: 1.05em;
  line-height: 1.75;
}

/* ── ARTICLE NAV BUTTONS ── */
.article-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 60px;
  padding-top: 32px;
  border-top: 1px solid var(--border);
  gap: 16px;
}
.art-nav-btn {
  flex: 1;
  padding: 14px 20px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Noto Serif TC', serif;
  font-size: 13px;
  color: var(--ink-light);
  text-align: left;
  transition: all 0.15s;
  line-height: 1.5;
}
.art-nav-btn:hover { border-color: var(--gold-light); color: var(--ink); }
.art-nav-btn.next { text-align: right; }
.art-nav-btn .nav-label {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--ink-faint);
  display: block;
  margin-bottom: 4px;
}
.art-nav-btn:disabled { opacity: 0.3; cursor: default; }
.art-nav-btn:disabled:hover { border-color: var(--border); color: var(--ink-light); }

/* ── MOBILE ── */
#mobile-nav-toggle {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 52px;
  height: 52px;
  background: var(--ink);
  color: var(--cream);
  border: none;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  z-index: 200;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  align-items: center;
  justify-content: center;
}
#sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 150;
}

@media (max-width: 800px) {
  #sidebar {
    position: fixed;
    left: -var(--sidebar-w);
    left: -320px;
    top: 0;
    z-index: 160;
    width: 300px;
    height: 100vh;
    transition: transform 0.3s ease;
    transform: translateX(-100%);
  }
  #sidebar.open {
    transform: translateX(0);
  }
  #sidebar-overlay.open { display: block; }
  #mobile-nav-toggle { display: flex; }
  #main { padding: 32px 20px 100px; }
  #hero { padding: 48px 20px 44px; }
  .chapter-cards { grid-template-columns: 1fr 1fr; gap: 12px; }
  .article-nav { flex-direction: column; }
  .art-nav-btn.next { text-align: left; }
}

@media (max-width: 480px) {
  .chapter-cards { grid-template-columns: 1fr; }
}

/* ── SEARCH RESULTS ── */
.search-results { padding: 8px 0; }
.search-result-item {
  display: block;
  padding: 8px 20px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  color: var(--ink-light);
}
.search-result-item:hover { background: rgba(154,125,74,0.06); color: var(--ink); }
.search-result-item .s-day { font-size: 11px; color: var(--ink-faint); font-family: 'Noto Sans TC', sans-serif; }
.no-results { padding: 16px 20px; font-size: 13px; color: var(--ink-faint); font-style: italic; }

/* ── PROGRESS BAR ── */
#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 2px;
  background: var(--gold);
  transition: width 0.1s;
  z-index: 300;
  width: 0;
}

/* ── READING PROGRESS ── */
.reading-meta {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.1em;
  margin-top: 8px;
}
</style>
</head>
